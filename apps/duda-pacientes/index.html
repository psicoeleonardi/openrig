<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Consultório — Pacientes</title>
<style>
:root {
  --bg: #f6f5f2; --surface: #ffffff; --surface-2: #f0eee9; --text: #23211d; --muted: #6d6961;
  --line: #e2dfd8; --accent: #5b6ee1; --accent-ink: #ffffff; --accent-soft: #e8ebfc;
  --ok: #1f8a5b; --ok-soft: #e1f3ea; --warn: #a86400; --warn-soft: #fbefd9;
  --bad: #c03a3a; --bad-soft: #fbe3e3; --info: #2f6fb0; --info-soft: #e1ecf8;
  --radius: 10px; --shadow: 0 1px 2px rgba(0,0,0,.05), 0 4px 16px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #171716; --surface: #211f1e; --surface-2: #2a2826; --text: #ece9e4; --muted: #a09b93;
    --line: #37342f; --accent: #8c9bf5; --accent-ink: #14151f; --accent-soft: #2b2f4a;
    --ok: #5fcf98; --ok-soft: #1c3329; --warn: #f0b457; --warn-soft: #3a2d17;
    --bad: #f07b7b; --bad-soft: #3d2020; --info: #7fb3ea; --info-soft: #1d2c3d;
    --shadow: none;
  }
}
:root[data-theme="dark"] {
  --bg: #171716; --surface: #211f1e; --surface-2: #2a2826; --text: #ece9e4; --muted: #a09b93;
  --line: #37342f; --accent: #8c9bf5; --accent-ink: #14151f; --accent-soft: #2b2f4a;
  --ok: #5fcf98; --ok-soft: #1c3329; --warn: #f0b457; --warn-soft: #3a2d17;
  --bad: #f07b7b; --bad-soft: #3d2020; --info: #7fb3ea; --info-soft: #1d2c3d;
  --shadow: none;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
h1 { font-size: 1.45rem; margin: 0; }
h2 { font-size: 1.1rem; margin: 0 0 .75rem; }
h3 { font-size: .95rem; margin: 0 0 .5rem; }
.muted { color: var(--muted); font-size: .88em; }
.num { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
.pre { white-space: pre-wrap; }

/* layout */
.top { position: sticky; top: 0; z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 12px; padding: 0 16px; }
.brand { font-weight: 700; white-space: nowrap; padding: 12px 0; }
.nav { display: flex; gap: 2px; overflow-x: auto; flex: 1; scrollbar-width: none; }
.nav a { padding: 14px 10px; color: var(--muted); white-space: nowrap; border-bottom: 2px solid transparent; }
.nav a:hover { color: var(--text); text-decoration: none; }
.nav a.on { color: var(--text); border-bottom-color: var(--accent); font-weight: 600; }
main { max-width: 1180px; margin: 0 auto; padding: 20px 16px 60px; }
.head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
.head .actions { display: flex; gap: 8px; flex-wrap: wrap; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); margin-bottom: 16px; min-width: 0; }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; align-items: start; }
.cols > .card { margin-bottom: 0; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 16px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; }
.stat b { display: block; font-size: 1.35rem; font-variant-numeric: tabular-nums; }
.stat span { color: var(--muted); font-size: .85rem; }
.stat.warn b { color: var(--warn); } .stat.bad b { color: var(--bad); }

/* buttons */
.btn { font: inherit; border: 1px solid var(--line); background: var(--surface); color: var(--text); border-radius: 8px; padding: 7px 12px; cursor: pointer; white-space: nowrap; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.07); }
.btn.danger { color: var(--bad); }
.btn.sm { padding: 3px 8px; font-size: .85rem; }
.btn.ghost { border-color: transparent; background: transparent; }
.btn:disabled { opacity: .5; cursor: default; }

/* tables */
.tw { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 8px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: .78rem; text-transform: uppercase; letter-spacing: .03em; color: var(--muted); font-weight: 600; }
tr:last-child td { border-bottom: 0; }
td.acts { text-align: right; white-space: nowrap; }
.empty { color: var(--muted); padding: 12px 0; text-align: center; }

/* badges */
.b { display: inline-block; font-size: .75rem; font-weight: 600; padding: 1px 8px; border-radius: 999px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.b.ok { background: var(--ok-soft); color: var(--ok); }
.b.warn { background: var(--warn-soft); color: var(--warn); }
.b.bad { background: var(--bad-soft); color: var(--bad); }
.b.info { background: var(--info-soft); color: var(--info); }
.b.acc { background: var(--accent-soft); color: var(--accent); }

/* menu */
details.menu { display: inline-block; position: relative; }
details.menu summary { list-style: none; }
details.menu summary::-webkit-details-marker { display: none; }
details.menu .items { position: fixed; z-index: 20; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,.15); min-width: 170px; padding: 4px; display: flex; flex-direction: column; }
details.menu .items button { text-align: left; border: 0; background: none; font: inherit; color: var(--text); padding: 7px 10px; border-radius: 6px; cursor: pointer; }
details.menu .items button:hover { background: var(--surface-2); }
details.menu .items button.danger { color: var(--bad); }

/* tabs */
.tabs { display: flex; gap: 4px; overflow-x: auto; border-bottom: 1px solid var(--line); margin-bottom: 16px; scrollbar-width: none; }
.tabs a { padding: 8px 12px; color: var(--muted); border-bottom: 2px solid transparent; white-space: nowrap; }
.tabs a.on { color: var(--text); border-bottom-color: var(--accent); font-weight: 600; }
.tabs a:hover { text-decoration: none; color: var(--text); }

/* forms */
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 14px; }
.full { grid-column: 1 / -1; }
.fld { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.fld > span { font-size: .82rem; font-weight: 600; color: var(--muted); }
.fld small { color: var(--muted); font-size: .8rem; }
input, select, textarea { font: inherit; color: var(--text); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; width: 100%; min-width: 0; }
textarea { resize: vertical; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
.check { display: flex; align-items: center; gap: 8px; font-size: .92rem; }
.check input { width: auto; }
.checks { display: flex; flex-direction: column; gap: 4px; max-height: 220px; overflow: auto; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
h3.sec { margin: 8px 0 -4px; font-size: .8rem; text-transform: uppercase; letter-spacing: .05em; color: var(--accent); }
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: end; margin-bottom: 12px; }
.toolbar .fld { flex: 1 1 150px; }
dialog { border: 1px solid var(--line); border-radius: 14px; padding: 0; width: min(680px, calc(100vw - 24px)); max-height: calc(100vh - 32px); background: var(--surface); color: var(--text); }
dialog::backdrop { background: rgba(0,0,0,.4); }
dialog form.dlg { padding: 20px; }
dialog .foot { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; position: sticky; bottom: -20px; background: var(--surface); padding: 12px 0 0; }

/* misc */
dl.kv { display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; margin: 0; }
dl.kv dt { color: var(--muted); font-size: .85rem; }
dl.kv dd { margin: 0; overflow-wrap: anywhere; }
.alert { border-radius: 8px; padding: 10px 12px; margin-bottom: 12px; background: var(--warn-soft); color: var(--warn); }
.alert.info { background: var(--info-soft); color: var(--info); }
.entry { border-left: 3px solid var(--accent); padding: 4px 0 4px 12px; margin-bottom: 16px; }
.entry .meta { display: flex; justify-content: space-between; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 4px; }
.gcard { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; }
.day { font-weight: 600; margin: 14px 0 4px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
#toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 8px 16px; border-radius: 8px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 50; }
#toast.show { opacity: 1; }

/* lock screen */
.lock { min-height: 100vh; display: grid; place-items: center; padding: 16px; }
.lock .card { width: min(420px, 100%); }
.lock p { color: var(--muted); font-size: .9rem; }
.err { color: var(--bad); font-size: .9rem; min-height: 1.3em; }

#print { display: none; }
@media (max-width: 640px) {
  .grid { grid-template-columns: 1fr; }
  .brand { display: none; }
  main { padding-top: 14px; }
  dl.kv { grid-template-columns: 1fr; }
  dl.kv dd { margin-bottom: 6px; }
  th, td { padding: 6px 5px; font-size: .9rem; }
  .card { padding: 12px; }
}
@media print {
  body.printing { background: #fff; }
  body.printing > *:not(#print) { display: none !important; }
  body.printing #print { display: block; color: #000; background: #fff; font: 12pt/1.5 Georgia, serif; }
  #print h1 { font-size: 16pt; } #print h2 { font-size: 13pt; margin-top: 18pt; }
  #print .pentry { margin-bottom: 10pt; page-break-inside: avoid; }
  #print .sign { margin-top: 48pt; text-align: center; }
  #print .sign div { border-top: 1px solid #000; width: 60%; margin: 0 auto; padding-top: 4pt; }
  #print table { border-collapse: collapse; } #print td, #print th { border: 1px solid #999; padding: 4pt 6pt; }
  #print .foot { margin-top: 24pt; font-size: 9pt; color: #555; }
}
</style>
</head>
<body>
<div id="lock" class="lock" hidden></div>
<div id="app" hidden>
  <header class="top">
    <div class="brand">Consultório</div>
    <nav class="nav" id="nav">
      <a href="#/inicio" data-page="inicio">Início</a>
      <a href="#/pacientes" data-page="pacientes">Pacientes</a>
      <a href="#/agenda" data-page="agenda">Agenda</a>
      <a href="#/financeiro" data-page="financeiro">Financeiro</a>
      <a href="#/contatos" data-page="contatos">Contatos</a>
      <a href="#/config" data-page="config">Configurações</a>
    </nav>
    <button class="btn sm" data-act="lock" title="Bloquear (os dados ficam criptografados)">Bloquear</button>
  </header>
  <main id="main"></main>
</div>
<dialog id="dlg"></dialog>
<div id="print"></div>
<div id="toast"></div>
<input type="file" id="fileIn" accept=".json,application/json" hidden>

<script>
'use strict';
/* ============================================================
   Gerenciador de pacientes — tudo roda no navegador.
   Os dados ficam no localStorage, criptografados (AES-GCM,
   chave derivada da senha com PBKDF2).
   ============================================================ */

const STORE = 'duda.pacientes.vault.v1';
const AUTOLOCK_MIN = 15;
const NFSE_NACIONAL = 'https://www.nfse.gov.br/EmissorNacional';

let db = null, key = null, salt = null;
const ui = { pq: '', pstatus: 'ativo', agFrom: '', agTo: '', agStatus: '', finMonth: '' };

/* ---------- utilidades ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
const pad = n => String(n).padStart(2, '0');
const toISO = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const today = () => toISO(new Date());
const parseISO = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d || 1); };
const addDays = (s, n) => { const d = parseISO(s); d.setDate(d.getDate() + n); return toISO(d); };
function addMonths(s, n) {
  const [y, m, d] = s.split('-').map(Number);
  const t = new Date(y, m - 1 + n, 1);
  const last = new Date(t.getFullYear(), t.getMonth() + 1, 0).getDate();
  t.setDate(Math.min(d, last));
  return toISO(t);
}
const daysUntil = s => Math.round((parseISO(s) - parseISO(today())) / 864e5);
const fmtD = s => s ? s.split('-').reverse().join('/') : '—';
const WD = ['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sáb'];
const fmtDW = s => s ? `${WD[parseISO(s).getDay()]}, ${fmtD(s)}` : '—';
const MONTHS = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
const fmtMonth = ym => ym ? `${MONTHS[Number(ym.slice(5, 7)) - 1]} de ${ym.slice(0, 4)}` : '';
const num = v => { const n = parseFloat(String(v ?? '').replace(/\./g, (m, i, s) => s.includes(',') ? '' : '.').replace(',', '.')); return isNaN(n) ? 0 : n; };
const money = n => (Number(n) || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
const sum = (arr, f) => arr.reduce((a, x) => a + num(f(x)), 0);
const digits = s => String(s || '').replace(/\D/g, '');
function age(n) {
  if (!n) return null;
  const b = parseISO(n), t = new Date();
  let a = t.getFullYear() - b.getFullYear();
  const m = t.getMonth() - b.getMonth();
  if (m < 0 || (m === 0 && t.getDate() < b.getDate())) a--;
  return a;
}
const isMinor = p => { const a = age(p.nasc); return a !== null && a < 18; };
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 2200); }
function download(name, text) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
  a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function waLink(phone) { const d = digits(phone); if (d.length < 10) return ''; return `https://wa.me/${d.length <= 11 ? '55' + d : d}`; }

/* valor por extenso (recibos) */
const U = ['', 'um', 'dois', 'três', 'quatro', 'cinco', 'seis', 'sete', 'oito', 'nove', 'dez', 'onze', 'doze', 'treze', 'quatorze', 'quinze', 'dezesseis', 'dezessete', 'dezoito', 'dezenove'];
const T = ['', '', 'vinte', 'trinta', 'quarenta', 'cinquenta', 'sessenta', 'setenta', 'oitenta', 'noventa'];
const H = ['', 'cento', 'duzentos', 'trezentos', 'quatrocentos', 'quinhentos', 'seiscentos', 'setecentos', 'oitocentos', 'novecentos'];
function ext3(n) {
  if (n === 100) return 'cem';
  const w = [], c = Math.floor(n / 100), r = n % 100;
  if (c) w.push(H[c]);
  if (r > 0 && r < 20) w.push(U[r]);
  else if (r >= 20) w.push(T[Math.floor(r / 10)] + (r % 10 ? ' e ' + U[r % 10] : ''));
  return w.join(' e ');
}
function extInt(x) {
  const m = Math.floor(x / 1e6), k = Math.floor(x / 1000) % 1000, r = x % 1000, parts = [];
  if (m) parts.push(m === 1 ? 'um milhão' : ext3(m) + ' milhões');
  if (k) parts.push(k === 1 ? 'mil' : ext3(k) + ' mil');
  if (r) parts.push(ext3(r));
  if (parts.length < 2) return parts[0] || '';
  const last = parts.pop();
  return parts.join(', ') + ((r && (r <= 100 || r % 100 === 0)) ? ' e ' : ' ') + last;
}
function extenso(v) {
  const n = Math.round(num(v) * 100), reais = Math.floor(n / 100), cent = n % 100, out = [];
  if (reais) out.push(extInt(reais) + (reais === 1 ? ' real' : (reais % 1e6 === 0 ? ' de reais' : ' reais')));
  if (cent) out.push(ext3(cent) + (cent === 1 ? ' centavo' : ' centavos'));
  return out.join(' e ') || 'zero real';
}

/* ---------- constantes de domínio ---------- */
const P_STATUS = { ativo: 'Ativo', pausa: 'Em pausa', alta: 'Alta', inativo: 'Inativo' };
const S_STATUS = { agendado: 'Agendado', realizado: 'Realizado', falta: 'Falta', cancelado: 'Cancelado', reagendado: 'Reagendado' };
const S_BADGE = { agendado: 'info', realizado: 'ok', falta: 'bad', cancelado: 'warn', reagendado: 'acc' };
const PAY_FORMS = ['Pix', 'Dinheiro', 'Cartão de crédito', 'Cartão de débito', 'Transferência bancária', 'Boleto', 'Convênio', 'Outro'];
const NF_STATUS = { pendente: 'A emitir', emitida: 'Emitida', cancelada: 'Cancelada' };
const NF_BADGE = { pendente: 'warn', emitida: 'ok', cancelada: '' };
const REC_TIPOS = ['Evolução de sessão', 'Anamnese', 'Avaliação', 'Devolutiva', 'Contato com responsáveis', 'Contato com escola/rede', 'Documento emitido', 'Encaminhamento', 'Supervisão', 'Outro'];
const MEIOS = ['WhatsApp', 'Telefone', 'Presencial', 'Videochamada', 'E-mail'];
const PARENTESCO = ['Mãe', 'Pai', 'Avó', 'Avô', 'Tia', 'Tio', 'Irmã(o)', 'Madrasta', 'Padrasto', 'Tutor(a) legal', 'Outro'];
const META_STATUS = { nao: 'Não iniciada', andamento: 'Em andamento', alcancada: 'Alcançada', suspensa: 'Revista / suspensa' };
const META_BADGE = { nao: '', andamento: 'info', alcancada: 'ok', suspensa: 'warn' };
const STUDY = [
  ['contexto', 'Identificação e contexto'], ['queixa', 'Queixa principal / demanda'],
  ['historiaQueixa', 'História da queixa atual'], ['historiaVida', 'História de vida e desenvolvimento'],
  ['familia', 'Dinâmica familiar e rede de apoio'], ['social', 'Contexto escolar, profissional e social'],
  ['observacoes', 'Observações clínicas e comportamentais'], ['avaliacao', 'Instrumentos e avaliações realizadas'],
  ['hipoteses', 'Hipóteses diagnósticas / diagnóstico'], ['formulacao', 'Formulação / compreensão do caso'],
  ['referencial', 'Referencial teórico'], ['riscoProtecao', 'Fatores de risco e de proteção'],
  ['supervisao', 'Discussão / supervisão'], ['evolucao', 'Evolução observada'],
];
const PLAN = [
  { t: 'section', l: 'Estrutura' },
  { k: 'abordagem', l: 'Abordagem terapêutica' },
  { k: 'frequencia', l: 'Frequência das sessões', ph: 'Ex.: semanal, 50 min' },
  { k: 'inicio', l: 'Início do plano', t: 'date' },
  { k: 'revisao', l: 'Próxima revisão do plano', t: 'date' },
  { k: 'duracao', l: 'Duração estimada', ph: 'Ex.: 6 meses' },
  { k: 'modalidade', l: 'Modalidade', t: 'select', empty: true, opts: ['Presencial', 'Online', 'Híbrido'] },
  { t: 'section', l: 'Objetivos e intervenções' },
  { k: 'objetivoGeral', l: 'Objetivo geral', t: 'textarea', rows: 3 },
  { k: 'intervencoes', l: 'Estratégias, técnicas e recursos', t: 'textarea', rows: 4 },
  { k: 'familia', l: 'Participação dos responsáveis / família', t: 'textarea', rows: 3 },
  { k: 'encaminhamentos', l: 'Encaminhamentos e articulação com a rede', t: 'textarea', rows: 3, ph: 'Psiquiatria, fono, escola, etc.' },
  { k: 'criteriosAlta', l: 'Critérios de alta', t: 'textarea', rows: 3 },
];

/* ---------- dados ---------- */
function emptyDB() {
  return { v: 1, patients: [], sessions: [], payments: [], invoices: [], contacts: [], records: [], settings: {} };
}
function migrate(d) {
  for (const k of ['patients', 'sessions', 'payments', 'invoices', 'contacts', 'records']) if (!Array.isArray(d[k])) d[k] = [];
  d.settings = Object.assign({ nome: '', crp: '', cpf: '', telefone: '', email: '', endereco: '', cidade: '', valorPadrao: '', duracaoPadrao: 50, descricaoNF: 'Serviços de psicologia (psicoterapia)', linkNF: NFSE_NACIONAL }, d.settings || {});
  for (const p of d.patients) { p.responsaveis ||= []; p.estudo ||= {}; p.plano ||= {}; p.plano.metas ||= []; }
  return d;
}
const P = id => db.patients.find(p => p.id === id);
const sessOf = id => db.sessions.filter(s => s.pacienteId === id);
const paysOf = id => db.payments.filter(p => p.pacienteId === id);
const invsOf = id => db.invoices.filter(i => i.pacienteId === id);
const bySess = (a, b) => (a.data + (a.hora || '')).localeCompare(b.data + (b.hora || ''));
const billable = s => s.status === 'realizado' || ((s.status === 'falta' || s.status === 'cancelado') && s.cobrar);
function balance(pid) {
  const due = sum(sessOf(pid).filter(billable), s => s.valor), paid = sum(paysOf(pid), p => p.valor);
  return { due, paid, bal: due - paid };
}
const invoiceOf = payId => db.invoices.find(i => i.status !== 'cancelada' && (i.pagamentos || []).includes(payId));
const nextSession = pid => sessOf(pid).filter(s => s.status === 'agendado' && s.data >= today()).sort(bySess)[0];

/* ---------- criptografia ---------- */
const enc = new TextEncoder(), dec = new TextDecoder();
function b64e(buf) { const b = new Uint8Array(buf); let s = ''; for (let i = 0; i < b.length; i += 0x8000) s += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000)); return btoa(s); }
function b64d(s) { const bin = atob(s), b = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) b[i] = bin.charCodeAt(i); return b; }
async function deriveKey(pw, saltBytes) {
  const base = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: saltBytes, iterations: 310000, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
}
async function sealVault(data, k, s) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, k, enc.encode(JSON.stringify(data)));
  return { app: 'duda-pacientes', v: 1, salt: b64e(s), iv: b64e(iv), ct: b64e(ct) };
}
async function openVault(vault, pw) {
  const s = b64d(vault.salt), k = await deriveKey(pw, s);
  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64d(vault.iv) }, k, b64d(vault.ct));
  return { data: JSON.parse(dec.decode(pt)), key: k, salt: s };
}
async function persist() {
  const vault = await sealVault(db, key, salt);
  try { localStorage.setItem(STORE, JSON.stringify(vault)); }
  catch (e) { alert('Não foi possível salvar: o armazenamento do navegador está cheio ou bloqueado. Faça um backup agora em Configurações.'); throw e; }
}
async function commit(msg) {
  db.atualizadoEm = new Date().toISOString();
  await persist();
  render();
  if (msg) toast(msg);
}

let pendingImport = null;
document.addEventListener('submit', async e => {
  const f = e.target;
  if (f.id === 'unlockForm') {
    e.preventDefault();
    const btn = $('button', f); btn.disabled = true; $('#lockErr').textContent = '';
    try {
      const r = await openVault(JSON.parse(localStorage.getItem(STORE)), f.pw.value);
      db = migrate(r.data); key = r.key; salt = r.salt; start();
    } catch { $('#lockErr').textContent = 'Senha incorreta.'; btn.disabled = false; f.pw.select(); }
  } else if (f.id === 'setupForm') {
    e.preventDefault();
    if (f.pw1.value !== f.pw2.value) { $('#lockErr').textContent = 'As senhas não conferem.'; return; }
    salt = crypto.getRandomValues(new Uint8Array(16));
    key = await deriveKey(f.pw1.value, salt);
    db = migrate(pendingImport || emptyDB()); pendingImport = null;
    await persist(); start();
    location.hash = db.settings.nome ? '#/inicio' : '#/config';
    toast(db.patients.length ? 'Backup restaurado.' : 'Tudo pronto! Preencha seus dados profissionais.');
  } else if (f.dataset.submit) {
    e.preventDefault();
    await actions[f.dataset.submit]?.(f.dataset, f);
  }
});

function optsHTML(opts, v) {

}
function fieldHTML(f, v) {
  if (f.t === 'section') return `<h3 class="full sec">${esc(f.l)}</h3>`;
  const full = (f.w === 'full' || f.t === 'textarea') ? ' full' : '';
  const req = f.req ? ' required' : '';
  const lab = `<span>${esc(f.l)}${f.req ? ' *' : ''}</span>`;
  const hint = f.hint ? `<small>${esc(f.hint)}</small>` : '';
  switch (f.t) {
    case 'textarea': return `<label class="fld${full}">${lab}<textarea name="${f.k}" rows="${f.rows || 4}"${req} placeholder="${esc(f.ph || '')}">${esc(v ?? '')}</textarea>${hint}</label>`;
    case 'select': return `<label class="fld${full}">${lab}<select name="${f.k}"${req}>${f.empty ? '<option value="">—</option>' : ''}${optsHTML(f.opts, v)}</select>${hint}</label>`;
    case 'checkbox': return `<label class="check full"><input type="checkbox" name="${f.k}"${v ? ' checked' : ''}> ${esc(f.l)}</label>`;
    case 'checks': return `<div class="fld full">${lab}<div class="checks">${f.opts.length ? f.opts.map(([ov, ol]) => `<label class="check"><input type="checkbox" name="${f.k}" value="${esc(ov)}"${(v || []).includes(ov) ? ' checked' : ''}> ${esc(ol)}</label>`).join('') : '<span class="muted">Nenhum item disponível.</span>'}</div>${hint}</div>`;
    case 'money': return `<label class="fld${full}">${lab}<input name="${f.k}" inputmode="decimal" placeholder="0,00" value="${v === '' || v == null ? '' : esc(String(v).replace('.', ','))}"${req}>${hint}</label>`;
    default: return `<label class="fld${full}">${lab}<input type="${f.t || 'text'}" name="${f.k}" value="${esc(v ?? '')}"${req}${f.t === 'number' ? ' step="any"' : ''} placeholder="${esc(f.ph || '')}">${hint}</label>`;
  }
}
function readForm(form, fields) {
  const o = {};
  for (const f of fields) {
    if (!f.k) continue;
    if (f.t === 'checkbox') o[f.k] = !!form.querySelector(`[name="${f.k}"]`)?.checked;
    else if (f.t === 'checks') o[f.k] = $$(`[name="${f.k}"]:checked`, form).map(e => e.value);
    else { const v = (form.elements[f.k]?.value ?? '').trim(); o[f.k] = f.t === 'money' ? (v === '' ? '' : num(v)) : v; }
  }
  return o;
}

function suggestReference(pid) {
  const bal = balance(pid);
  if (bal.bal <= 0) return { valor: '', referencia: '' };
  // sessões cobráveis mais recentes que somam o saldo em aberto
  const ss = sessOf(pid).filter(billable).sort(bySess).reverse(); let acc = 0; const pick = [];
  for (const s of ss) { if (acc >= bal.bal - 0.005) break; acc += num(s.valor); pick.unshift(s); }
  return { valor: Math.round(bal.bal * 100) / 100, referencia: pick.length ? 'Sessões de ' + pick.map(s => fmtD(s.data).slice(0, 5)).join(', ') : '' };
}
function newPayment(pid) {
  const p = P(pid), pay = payer(p), sug = suggestReference(pid);
  openForm({ title: `Pagamento — ${p.nome}`, fields: paymentFields(),
    values: { data: today(), forma: 'Pix', pagador: pay.nome, pagadorCpf: pay.cpf, ...sug },
    intro: sug.valor ? `<div class="alert info">Saldo em aberto: <b>${money(sug.valor)}</b>. Valor e referência foram sugeridos.</div>` : '',
    onSave: async v => { if (!v.valor) { alert('Informe o valor.'); return false; } db.payments.push({ id: uid(), pacienteId: pid, ...v }); await commit('Pagamento registrado.'); } });
}

function readFile() {
  return new Promise(res => {
    const inp = $('#fileIn'); inp.value = '';
    inp.onchange = () => { const f = inp.files[0]; if (!f) return res(null); const r = new FileReader(); r.onload = () => res(r.result); r.readAsText(f); };
    inp.click();
  });
}
async function parseBackup(text) {
  let obj; try { obj = JSON.parse(text); } catch { alert('Arquivo inválido.'); return null; }
  if (obj.ct && obj.salt) {
    const pw = prompt('Este backup é criptografado. Digite a senha usada quando ele foi criado:');
    if (!pw) return null;
    try { return (await openVault(obj, pw)).data; } catch { alert('Senha incorreta para este backup.'); return null; }
  }
  if (!Array.isArray(obj.patients)) { alert('Este arquivo não parece ser um backup do gerenciador.'); return null; }
  return obj;
}
actions['setup-import'] = async () => {
  const text = await readFile(); if (!text) return;
  const data = await parseBackup(text); if (!data) return;
  pendingImport = data;
  $('#lockErr').textContent = '';
  $('#setupForm p').innerHTML = `<b>Backup carregado: ${data.patients.length} paciente(s).</b> Agora crie a senha para este computador.`;
};
actions.import = async () => {
  const text = await readFile(); if (!text) return;
  const data = await parseBackup(text); if (!data) return;
  if (!confirm(`Substituir TODOS os dados atuais (${db.patients.length} pacientes) pelo backup (${data.patients.length} pacientes)?`)) return;
  db = migrate(data); await commit('Backup restaurado.');
};

  return quick + menu([

    s.status === 'agendado' && ['sess-cancel', 'Cancelar', { id: s.id }],
    s.status === 'agendado' && ['sess-resched', 'Reagendar', { id: s.id }],
    (s.status === 'realizado' || s.status === 'falta') && ['new-record', 'Escrever no prontuário', { pid: s.pacienteId, sess: s.id }],
    ['edit-session', 'Editar', { id: s.id }],

function sessDetail(s) {
  const bits = [];
  if (s.status === 'reagendado' && s.reagendadoPara) bits.push(`→ ${fmtD(s.reagendadoPara.data)} ${esc(s.reagendadoPara.hora || '')}`);
  if (s.reagendadoDe) { const o = S(s.reagendadoDe); bits.push(`reagendada${o ? ' de ' + fmtD(o.data) : ''}`); }

  return bits.length ? `<div class="muted">${bits.join(' · ')}</div>` : '';
}

function invTable(list, { showPat = true } = {}) {

function vDashboard() {
  const t = today(), wk = addDays(t, 7), month = t.slice(0, 7);

  const contacts = active.filter(isMinor).map(p => ({ p, ...contactInfo(p) })).filter(c => c.dias <= 7).sort((a, b) => a.next.localeCompare(b.next));
  const owing = db.patients.map(p => ({ p, ...balance(p.id) })).filter(x => x.bal > 0.005).sort((a, b) => b.bal - a.bal);
  const semNF = db.payments.filter(x => !invoiceOf(x.id));

    nfPend.length && `<li><a href="#/financeiro">${nfPend.length} nota(s) fiscal(is) a emitir</a>.</li>`,
    semNF.length && `<li><a href="#/financeiro">${semNF.length} pagamento(s) ainda sem nota fiscal</a>.</li>`,
  ].filter(Boolean);
  return `<div class="head"><div><h1>Olá${db.settings.nome ? ', ' + esc(db.settings.nome.split(' ')[0]) : ''}!</h1><div class="muted">${fmtDW(t)}</div></div>
    <div class="actions"><button class="btn" data-act="new-session">+ Agendar</button><button class="btn" data-act="new-payment">+ Pagamento</button><button class="btn primary" data-act="new-patient">+ Paciente</button></div></div>
    <div class="stats">
      <div class="stat"><b>${active.length}</b><span>pacientes ativos</span></div>
      <div class="stat"><b>${upcoming.length}</b><span>sessões nos próximos 7 dias</span></div>
      <div class="stat"><b>${money(recMes)}</b><span>recebido em ${MONTHS[Number(month.slice(5)) - 1]}</span></div>
      <div class="stat ${owing.length ? 'warn' : ''}"><b>${money(sum(owing, x => x.bal))}</b><span>a receber</span></div>
      <div class="stat ${contacts.some(c => c.dias < 0) ? 'bad' : contacts.length ? 'warn' : ''}"><b>${contacts.length}</b><span>contatos c/ responsáveis</span></div>
    </div>
    ${stale.length ? `<div class="card"><h2>Atualize a situação destas sessões passadas</h2><p class="muted">Ainda estão como “agendado”. Marque se foram realizadas, faltas, cancelamentos ou reagendamentos.</p>${sessTable(stale)}</div>` : ''}
    <div class="cols">
      <div class="card"><h2>Próximos 7 dias</h2>${sessTable(upcoming)}</div>
      <div>
        <div class="card"><h2>Contatos com responsáveis</h2>${contacts.length ? `<div class="tw"><table><tbody>${contacts.map(c => `<tr><td><a href="#/p/${c.p.id}/contatos">${esc(c.p.nome)}</a><div class="muted">${fmtD(c.next)}</div></td><td>${contactBadge(c.dias)}</td><td class="acts"><button class="btn sm" data-act="new-contact" data-pid="${c.p.id}">Registrar</button></td></tr>`).join('')}</tbody></table></div>` : '<div class="empty">Nenhum contato previsto para os próximos 7 dias.</div>'}</div>
        <div class="card"><h2>Pendências</h2>${pend.length ? `<ul style="margin:0;padding-left:18px">${pend.join('')}</ul>` : '<div class="empty">Tudo em dia. 🌿</div>'}</div>
        ${owing.length ? `<div class="card"><h2>Saldos em aberto</h2><div class="tw"><table><tbody>${owing.map(x => `<tr><td><a href="#/p/${x.p.id}/financeiro">${esc(x.p.nome)}</a></td><td class="num">${money(x.bal)}</td><td class="acts"><button class="btn sm" data-act="new-payment" data-pid="${x.p.id}">Receber</button></td></tr>`).join('')}</tbody></table></div></div>` : ''}
      </div>

function tAtend(p) {

function tPront(p) {
  const rs = db.records.filter(r => r.pacienteId === p.id).sort((a, b) => b.data.localeCompare(a.data) || (b.criadoEm || '').localeCompare(a.criadoEm || ''));
  const pendentes = sessOf(p.id).filter(s => s.status === 'realizado' && !db.records.some(r => r.sessaoId === s.id)).sort(bySess).reverse();
  return `${pendentes.length ? `<div class="alert info">${pendentes.length} sessão(ões) realizada(s) sem evolução no prontuário: ${pendentes.slice(0, 6).map(s => `<a href="#" data-act="new-record" data-pid="${p.id}" data-sess="${s.id}">${fmtD(s.data)}</a>`).join(', ')}${pendentes.length > 6 ? '…' : ''}</div>` : ''}
    <div class="card"><div class="head" style="margin-bottom:12px"><h2 style="margin:0">Prontuário (${rs.length} registro${rs.length === 1 ? '' : 's'})</h2><div class="actions"><button class="btn sm" data-act="print-records" data-pid="${p.id}">Imprimir / PDF</button><button class="btn sm primary" data-act="new-record" data-pid="${p.id}">+ Registro</button></div></div>
    ${rs.map(r => { const s = r.sessaoId ? S(r.sessaoId) : null; return `<div class="entry"><div class="meta"><div><b>${fmtD(r.data)}</b> · ${esc(r.tipo)}${s ? ` <span class="muted">(sessão ${esc(s.hora || '')})</span>` : ''}${r.editadoEm ? ` <span class="muted">· editado em ${fmtD(r.editadoEm.slice(0, 10))}</span>` : ''}</div>${menu([['edit-record', 'Editar', { id: r.id }], ['del-record', 'Excluir', { id: r.id }, 'danger']])}</div><div class="pre">${esc(r.texto)}</div></div>`; }).join('') || '<div class="empty">Nenhum registro ainda.</div>'}
    <p class="muted" style="margin-bottom:0">Lembrete: a Resolução CFP nº 01/2009 pede a guarda do registro documental por no mínimo 5 anos.</p></div>`;
}
function tEstudo(p) {
  const e = p.estudo;
  return `<form class="card" data-submit="save-study" data-autosave="save-study" data-pid="${p.id}">
    <div class="head"><div><h2 style="margin:0">Estudo de caso</h2><div class="muted" id="savedAt">${e.atualizadoEm ? 'Última atualização: ' + fmtD(e.atualizadoEm.slice(0, 10)) : 'Salva automaticamente ao sair de cada campo.'}</div></div>
    <div class="actions"><button type="button" class="btn sm" data-act="print-study" data-pid="${p.id}">Imprimir / PDF</button><button class="btn sm primary">Salvar</button></div></div>
    <div class="grid">${STUDY.map(([k, l]) => fieldHTML({ k, l, t: 'textarea', rows: 4 }, e[k])).join('')}</div></form>`;
}
function tPlano(p) {
  const pl = p.plano;
  return `<form class="card" id="planForm" data-submit="save-plan" data-autosave="save-plan" data-pid="${p.id}">
    <div class="head"><div><h2 style="margin:0">Plano de tratamento</h2><div class="muted" id="savedAt">${pl.atualizadoEm ? 'Última atualização: ' + fmtD(pl.atualizadoEm.slice(0, 10)) : 'Salvo automaticamente ao sair de cada campo.'}</div></div>
    <div class="actions"><button type="button" class="btn sm" data-act="print-plan" data-pid="${p.id}">Imprimir / PDF</button><button class="btn sm primary">Salvar</button></div></div>
    ${pl.revisao && pl.revisao <= today() ? `<div class="alert">A data de revisão do plano (${fmtD(pl.revisao)}) chegou.</div>` : ''}
    <div class="grid">${PLAN.map(f => fieldHTML(f, pl[f.k])).join('')}</div></form>
  <div class="card"><h2>Metas terapêuticas</h2>
    ${pl.metas.length ? `<div class="tw"><table><tbody>${pl.metas.map(m => `<tr><td>${esc(m.texto)}<div class="muted">criada em ${fmtD(m.criadaEm)}${m.atualizadaEm ? ' · atualizada em ' + fmtD(m.atualizadaEm) : ''}</div></td>
      <td style="width:190px"><select data-change="meta-status" data-pid="${p.id}" data-mid="${m.id}">${optsHTML(Object.entries(META_STATUS), m.status)}</select></td>
      <td class="acts"><button class="btn sm danger" data-act="del-meta" data-pid="${p.id}" data-mid="${m.id}">Remover</button></td></tr>`).join('')}</tbody></table></div>` : '<div class="empty">Nenhuma meta ainda.</div>'}
    <div class="row" style="margin-top:10px"><input id="newMeta" placeholder="Nova meta (ex.: reduzir crises de ansiedade antes das provas)" style="flex:1 1 260px" onkeydown="if(event.key==='Enter'){event.preventDefault();document.getElementById('addMetaBtn').click()}"><button class="btn primary" id="addMetaBtn" data-act="add-meta" data-pid="${p.id}">Adicionar</button></div></div>`;
}

function vAgenda() {
  const t = today();
  if (!ui.agFrom) ui.agFrom = t;
  if (!ui.agTo) ui.agTo = addDays(t, 30);
  const inRange = db.sessions.filter(s => s.data >= ui.agFrom && s.data <= ui.agTo);
  const list = inRange.filter(s => !ui.agStatus || s.status === ui.agStatus).sort(bySess);
  const days = [...new Set(list.map(s => s.data))];
  const c = st => inRange.filter(s => s.status === st).length;
  const preset = (l, a, b) => `<button class="btn sm" data-act="ag-range" data-a="${a}" data-b="${b}">${l}</button>`;
  const m0 = t.slice(0, 8) + '01', mPrev = addMonths(m0, -1);
  return `<div class="head"><h1>Agenda</h1><div class="actions"><button class="btn primary" data-act="new-session">+ Agendar sessão</button></div></div>
    <div class="card"><div class="toolbar">
      <label class="fld"><span>De</span><input type="date" data-ui="agFrom" value="${ui.agFrom}"></label>
      <label class="fld"><span>Até</span><input type="date" data-ui="agTo" value="${ui.agTo}"></label>
      <label class="fld"><span>Situação</span><select data-ui="agStatus">${optsHTML([['', 'Todas'], ...Object.entries(S_STATUS)], ui.agStatus)}</select></label>
    </div><div class="row">${preset('Hoje', t, t)}${preset('Próximos 7 dias', t, addDays(t, 7))}${preset('Próximos 30 dias', t, addDays(t, 30))}${preset('Este mês', m0, addDays(addMonths(m0, 1), -1))}${preset('Mês passado', mPrev, addDays(m0, -1))}</div></div>
    <div class="stats"><div class="stat"><b>${c('agendado')}</b><span>agendadas</span></div><div class="stat"><b>${c('realizado')}</b><span>realizadas</span></div><div class="stat"><b>${c('falta')}</b><span>faltas</span></div><div class="stat"><b>${c('cancelado')}</b><span>cancelamentos</span></div><div class="stat"><b>${c('reagendado')}</b><span>reagendamentos</span></div></div>
    <div class="card">${days.length ? days.map(d => `<div class="day">${fmtDW(d)}${d === t ? ' ' + badge('hoje', 'acc') : ''}</div>${sessTable(list.filter(s => s.data === d))}`).join('') : '<div class="empty">Nenhuma sessão neste período.</div>'}</div>`;
}
actions['ag-range'] = ({ a, b }) => { ui.agFrom = a; ui.agTo = b; render(); };

function vFinance() {
  const month = ui.finMonth || today().slice(0, 7);
  const pays = db.payments.filter(x => x.data.startsWith(month)).sort((a, b) => b.data.localeCompare(a.data));
  const byForm = {}; pays.forEach(x => { byForm[x.forma || 'Outro'] = (byForm[x.forma || 'Outro'] || 0) + num(x.valor); });
  const invs = db.invoices.filter(i => (i.dataEmissao || '').startsWith(month) || (!i.dataEmissao && i.competencia === month) || i.status === 'pendente').sort((a, b) => (b.dataEmissao || '').localeCompare(a.dataEmissao || ''));
  const billed = sum(db.sessions.filter(s => s.data.startsWith(month) && billable(s)), s => s.valor);
  const nfTotal = sum(db.invoices.filter(i => i.status === 'emitida' && (i.dataEmissao || '').startsWith(month)), i => i.valor);
  const semNF = db.payments.filter(x => !invoiceOf(x.id)).sort((a, b) => b.data.localeCompare(a.data));
  const bals = db.patients.map(p => ({ p, ...balance(p.id) })).filter(x => Math.abs(x.bal) > 0.005).sort((a, b) => b.bal - a.bal);
  return `<div class="head"><h1>Financeiro</h1><div class="actions">${nfLink()}<button class="btn" data-act="new-invoice">+ Nota fiscal</button><button class="btn primary" data-act="new-payment">+ Pagamento</button></div></div>
    <div class="card"><div class="toolbar"><label class="fld" style="flex:0 1 220px"><span>Mês</span><input type="month" data-ui="finMonth" value="${month}"></label></div>
      <div class="stats" style="margin:0"><div class="stat"><b>${money(sum(pays, x => x.valor))}</b><span>recebido em ${fmtMonth(month)}</span></div>
      <div class="stat"><b>${money(billed)}</b><span>sessões cobráveis no mês</span></div><div class="stat"><b>${money(nfTotal)}</b><span>em notas emitidas no mês</span></div>
      <div class="stat ${semNF.length ? 'warn' : ''}"><b>${semNF.length}</b><span>pagamentos sem NF (total)</span></div></div>
      ${Object.keys(byForm).length ? `<div class="row" style="margin-top:12px">${Object.entries(byForm).map(([f, v]) => badge(`${f}: ${money(v)}`, 'info')).join('')}</div>` : ''}</div>
    <div class="card"><h2>Pagamentos de ${fmtMonth(month)}</h2>${payTable(pays)}</div>
    <div class="card"><h2>Notas fiscais (emitidas no mês e pendentes)</h2>${invTable(invs)}</div>
    ${semNF.length ? `<div class="card"><h2>Pagamentos sem nota fiscal</h2>${payTable(semNF)}</div>` : ''}
    <div class="card"><h2>Saldos por paciente</h2>${bals.length ? `<div class="tw"><table><thead><tr><th>Paciente</th><th class="num">Cobrável</th><th class="num">Pago</th><th class="num">Saldo</th><th></th></tr></thead><tbody>${bals.map(x => `<tr><td><a href="#/p/${x.p.id}/financeiro">${esc(x.p.nome)}</a></td><td class="num">${money(x.due)}</td><td class="num">${money(x.paid)}</td><td class="num">${x.bal > 0 ? `<b style="color:var(--warn)">${money(x.bal)}</b>` : `<span class="muted">crédito ${money(-x.bal)}</span>`}</td><td class="acts">${x.bal > 0 ? `<button class="btn sm" data-act="new-payment" data-pid="${x.p.id}">Receber</button>` : ''}</td></tr>`).join('')}</tbody></table></div>` : '<div class="empty">Todos os pacientes estão em dia.</div>'}</div>`;
}

function vContacts() {
  const list = db.patients.filter(needsContact).map(p => ({ p, ...contactInfo(p) })).sort((a, b) => a.next.localeCompare(b.next));
  return `<div class="head"><div><h1>Contatos com responsáveis</h1><div class="muted">Pacientes menores de idade ativos — um contato a cada mês.</div></div></div>
    <div class="card">${list.length ? `<div class="tw"><table><thead><tr><th>Paciente</th><th>Responsáveis</th><th>Último contato</th><th>Próximo</th><th></th></tr></thead><tbody>${list.map(c => `<tr>
      <td><a href="#/p/${c.p.id}/contatos"><b>${esc(c.p.nome)}</b></a><div class="muted">${age(c.p.nasc)} anos</div></td><td>${guardiansInline(c.p)}</td>
      <td>${c.last ? `${fmtD(c.last.data)}<div class="muted">${esc(c.last.meio)}</div>` : '<span class="muted">nunca</span>'}</td>
      <td>${fmtD(c.next)}<div>${contactBadge(c.dias)}</div></td>
      <td class="acts"><button class="btn sm primary" data-act="new-contact" data-pid="${c.p.id}">Registrar</button></td></tr>`).join('')}</tbody></table></div>` : '<div class="empty">Nenhum paciente menor de idade ativo.</div>'}</div>`;
}

function vConfig() {
  let size = 0; try { size = (localStorage.getItem(STORE) || '').length * 2; } catch {}
  const theme = document.documentElement.dataset.theme || '';
  return `<div class="head"><h1>Configurações</h1></div>
    <form class="card" data-submit="save-settings"><div class="grid">${SETTINGS_FIELDS.map(f => fieldHTML(f, db.settings[f.k])).join('')}</div>
      <div class="row" style="justify-content:flex-end;margin-top:14px"><button class="btn primary">Salvar configurações</button></div></form>
    <div class="cols">
      <div class="card"><h2>Backup</h2>
        <p class="muted">Os dados ficam apenas neste navegador, neste computador. Faça backups com frequência (ex.: toda semana) e guarde em um pendrive ou nuvem.</p>
        <div class="row"><button class="btn primary" data-act="export-vault">Baixar backup criptografado</button><button class="btn" data-act="import">Restaurar backup</button></div>
        <p class="muted">O backup criptografado só abre com a senha atual. Para levar a outro computador, abra este arquivo lá e escolha “Restaurar backup”.</p>
        <button class="btn sm" data-act="export-json">Exportar dados abertos (sem criptografia)</button>
        <p class="muted" style="margin-bottom:0">Espaço usado: ${(size / 1024).toFixed(0)} KB de ~5.000 KB disponíveis no navegador.</p></div>
      <div class="card"><h2>Segurança e aparência</h2>
        <p class="muted">Bloqueio automático após ${AUTOLOCK_MIN} minutos sem uso.</p>
        <div class="row"><button class="btn" data-act="change-pw">Trocar senha</button><button class="btn" data-act="lock">Bloquear agora</button></div>
        <h3 style="margin-top:16px">Tema</h3><div class="row">${[['', 'Automático'], ['light', 'Claro'], ['dark', 'Escuro']].map(([v, l]) => `<button class="btn sm ${theme === v ? 'primary' : ''}" data-act="theme" data-v="${v}">${l}</button>`).join('')}</div>
        <h3 style="margin-top:16px">Zona de perigo</h3><button class="btn danger" data-act="wipe">Apagar todos os dados deste navegador</button></div>
    </div>`;
}
const _theme = actions.theme; actions.theme = d => { _theme(d); render(); };

/* ---------- roteador ---------- */
function route() { const [page, id, tab] = (location.hash.slice(2) || 'inicio').split('/'); return { page, id, tab }; }
function render() {
  if (!db) return;
  const r = route();
  listRenderer = null;
  const views = { inicio: vDashboard, pacientes: vPatients, p: vPatient, agenda: vAgenda, financeiro: vFinance, contatos: vContacts, config: vConfig };
  const active = document.activeElement, focusKey = active?.dataset?.ui, selStart = active?.selectionStart;
  $('#main').innerHTML = (views[r.page] || vDashboard)(r);
  $$('#nav a').forEach(a => a.classList.toggle('on', a.dataset.page === (r.page === 'p' ? 'pacientes' : r.page)));
  if (focusKey) { const el = $(`[data-ui="${focusKey}"]`); if (el) { el.focus(); try { el.setSelectionRange(selStart, selStart); } catch {} } }
}
let lastPage = '';
window.addEventListener('hashchange', () => { const k = location.hash.split('/').slice(0, 3).join('/'); if (k !== lastPage) window.scrollTo(0, 0); lastPage = k; render(); });

showLock();
</script>
</body>
</html>
