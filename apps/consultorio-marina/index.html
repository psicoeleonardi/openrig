<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Consultório da Marina</title>
<style>
:root {
  --bg: #f6f5f2; --surface: #ffffff; --surface-2: #f0eee9; --text: #23211d; --muted: #6d6961;
  --line: #e2dfd8; --accent: #c2417a; --accent-ink: #ffffff; --accent-soft: #fbe3ee;
  --ok: #1f8a5b; --ok-soft: #e1f3ea; --warn: #a86400; --warn-soft: #fbefd9;
  --bad: #c03a3a; --bad-soft: #fbe3e3; --info: #2f6fb0; --info-soft: #e1ecf8;
  --radius: 10px; --shadow: 0 1px 2px rgba(0,0,0,.05), 0 4px 16px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #171716; --surface: #211f1e; --surface-2: #2a2826; --text: #ece9e4; --muted: #a09b93;
    --line: #37342f; --accent: #f28cb8; --accent-ink: #2a0f1c; --accent-soft: #46202f;
    --ok: #5fcf98; --ok-soft: #1c3329; --warn: #f0b457; --warn-soft: #3a2d17;
    --bad: #f07b7b; --bad-soft: #3d2020; --info: #7fb3ea; --info-soft: #1d2c3d;
    --shadow: none; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #171716; --surface: #211f1e; --surface-2: #2a2826; --text: #ece9e4; --muted: #a09b93;
  --line: #37342f; --accent: #f28cb8; --accent-ink: #2a0f1c; --accent-soft: #46202f;
  --ok: #5fcf98; --ok-soft: #1c3329; --warn: #f0b457; --warn-soft: #3a2d17;
  --bad: #f07b7b; --bad-soft: #3d2020; --info: #7fb3ea; --info-soft: #1d2c3d;
  --shadow: none;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
h1 { font-size: 1.45rem; margin: 0; }
h2 { font-size: 1.1rem; margin: 0 0 .75rem; }
h3 { font-size: .95rem; margin: 0 0 .5rem; }
.muted { color: var(--muted); font-size: .88em; }
.num { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
.pre { white-space: pre-wrap; }

/* layout */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 12px; padding: 0 16px; }
.brand { font-weight: 700; white-space: nowrap; padding: 12px 0; }
.nav { display: flex; gap: 2px; overflow-x: auto; flex: 1; scrollbar-width: none; }
.nav a { padding: 14px 10px; color: var(--muted); white-space: nowrap; border-bottom: 2px solid transparent; }
.nav a:hover { color: var(--text); text-decoration: none; }
.nav a.on { color: var(--text); border-bottom-color: var(--accent); font-weight: 600; }
main { max-width: 1180px; margin: 0 auto; padding: 20px 16px 60px; }
.head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
.head .actions { display: flex; gap: 8px; flex-wrap: wrap; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); margin-bottom: 16px; min-width: 0; }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; align-items: start; }
.cols > .card { margin-bottom: 0; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 16px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; }
.stat b { display: block; font-size: 1.35rem; font-variant-numeric: tabular-nums; }
.stat span { color: var(--muted); font-size: .85rem; }
.stat.warn b { color: var(--warn); } .stat.bad b { color: var(--bad); }

/* buttons */
.btn { font: inherit; border: 1px solid var(--line); background: var(--surface); color: var(--text); border-radius: 8px; padding: 7px 12px; cursor: pointer; white-space: nowrap; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.07); }
.btn.danger { color: var(--bad); }
.btn.dangerfill { background: var(--bad); color: var(--bg); border-color: var(--bad); font-weight: 600; }
.wa { display: inline-block; font-size: .75rem; font-weight: 600; padding: 1px 9px; border-radius: 999px; background: var(--ok-soft); color: var(--ok); white-space: nowrap; }
.wa:hover { text-decoration: none; filter: brightness(.96); }
.phone { white-space: nowrap; }
.sync { font-size: .78rem; color: var(--muted); white-space: nowrap; }
.sync.bad { color: var(--bad); }
.btn.sm { padding: 3px 8px; font-size: .85rem; }
.btn.ghost { border-color: transparent; background: transparent; }
.btn:disabled { opacity: .5; cursor: default; }

/* tables */
.tw { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 8px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: .78rem; text-transform: uppercase; letter-spacing: .03em; color: var(--muted); font-weight: 600; }
tr:last-child td { border-bottom: 0; }
td.acts { text-align: right; white-space: nowrap; }
.empty { color: var(--muted); padding: 12px 0; text-align: center; }

/* badges */
.b { display: inline-block; font-size: .75rem; font-weight: 600; padding: 1px 8px; border-radius: 999px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.b.ok { background: var(--ok-soft); color: var(--ok); }
.b.warn { background: var(--warn-soft); color: var(--warn); }
.b.bad { background: var(--bad-soft); color: var(--bad); }
.b.info { background: var(--info-soft); color: var(--info); }
.b.acc { background: var(--accent-soft); color: var(--accent); }

/* menu */
details.menu { display: inline-block; position: relative; }
details.menu summary { list-style: none; }
details.menu summary::-webkit-details-marker { display: none; }
details.menu .items { position: fixed; z-index: 20; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,.15); min-width: 170px; padding: 4px; display: flex; flex-direction: column; }
details.menu .items button { text-align: left; border: 0; background: none; font: inherit; color: var(--text); padding: 7px 10px; border-radius: 6px; cursor: pointer; }
details.menu .items button:hover { background: var(--surface-2); }
details.menu .items button.danger { color: var(--bad); }
details.menu .items a.mi { display: block; padding: 7px 10px; border-radius: 6px; color: var(--text); }
details.menu .items a.mi:hover { background: var(--surface-2); text-decoration: none; }
a.btn { display: inline-block; text-decoration: none; }

/* tabs */
.tabs { display: flex; gap: 4px; overflow-x: auto; border-bottom: 1px solid var(--line); margin-bottom: 16px; scrollbar-width: none; }
.tabs a { padding: 8px 12px; color: var(--muted); border-bottom: 2px solid transparent; white-space: nowrap; }
.tabs a.on { color: var(--text); border-bottom-color: var(--accent); font-weight: 600; }
.tabs a:hover { text-decoration: none; color: var(--text); }

/* forms */
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 14px; }
.full { grid-column: 1 / -1; }
.fld { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.fld > span { font-size: .82rem; font-weight: 600; color: var(--muted); }
.fld small { color: var(--muted); font-size: .8rem; }
input, select, textarea { font: inherit; color: var(--text); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; width: 100%; min-width: 0; }
textarea { resize: vertical; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
.check { display: flex; align-items: center; gap: 8px; font-size: .92rem; }
.check input { width: auto; }
.checks { display: flex; flex-direction: column; gap: 4px; max-height: 220px; overflow: auto; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
h3.sec { margin: 8px 0 -4px; font-size: .8rem; text-transform: uppercase; letter-spacing: .05em; color: var(--accent); }
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: end; margin-bottom: 12px; }
.toolbar .fld { flex: 1 1 150px; }
dialog { border: 1px solid var(--line); border-radius: 14px; padding: 0; width: min(680px, calc(100vw - 24px)); max-height: calc(100vh - 32px); background: var(--surface); color: var(--text); }
dialog::backdrop { background: rgba(0,0,0,.4); }
dialog form.dlg { padding: 20px; }
dialog .foot { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; position: sticky; bottom: -20px; background: var(--surface); padding: 12px 0 0; }

/* misc */
dl.kv { display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; margin: 0; }
dl.kv dt { color: var(--muted); font-size: .85rem; }
dl.kv dd { margin: 0; overflow-wrap: anywhere; }
.alert { border-radius: 8px; padding: 10px 12px; margin-bottom: 12px; background: var(--warn-soft); color: var(--warn); }
.alert.info { background: var(--info-soft); color: var(--info); }
.entry { border-left: 3px solid var(--accent); padding: 4px 0 4px 12px; margin-bottom: 16px; }
.entry .meta { display: flex; justify-content: space-between; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 4px; }
.gcard { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; }
.day { font-weight: 600; margin: 14px 0 4px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
#toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 8px 16px; border-radius: 8px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 50; }
#toast.show { opacity: 1; }

/* lock screen */
.lock { min-height: 100vh; display: grid; place-items: center; padding: 16px; }
.lock .card { width: min(420px, 100%); }
.lock p { color: var(--muted); font-size: .9rem; }
.err { color: var(--bad); font-size: .9rem; min-height: 1.3em; }

<script>
'use strict';
/* ============================================================
   Gerenciador de pacientes — tudo roda no navegador.
   Os dados ficam no localStorage, criptografados (AES-GCM,
   chave derivada da senha com PBKDF2).
   ============================================================ */

/* ---------- versão ----------
   O que muda de uma pessoa para outra fica só aqui. Para gerar a versão de outra profissional,
   use gerar-versao.py (troca este bloco e o <title>). */
const APP = {
  chave: 'marina',  // prefixo do armazenamento no navegador; cada versão tem o seu
  plataformasPadrao: [],  // plataformas que já vêm cadastradas (nenhuma nesta versão)
};
const STORE = `${APP.chave}.pacientes.vault.v1`;
const AUTOLOCK_MIN = 15;
const NFSE_NACIONAL = 'https://www.nfse.gov.br/EmissorNacional';

let db = null, key = null, salt = null;
const ui = { pq: '', pstatus: 'ativo', agFrom: '', agTo: '', agStatus: '', finMonth: '' };

/* ---------- utilidades ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
const pad = n => String(n).padStart(2, '0');
const toISO = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const today = () => toISO(new Date());
const parseISO = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d || 1); };
const addDays = (s, n) => { const d = parseISO(s); d.setDate(d.getDate() + n); return toISO(d); };
function addMonths(s, n) {
  const [y, m, d] = s.split('-').map(Number);
  const t = new Date(y, m - 1 + n, 1);
  const last = new Date(t.getFullYear(), t.getMonth() + 1, 0).getDate();
  t.setDate(Math.min(d, last));
  return toISO(t);
}
const daysUntil = s => Math.round((parseISO(s) - parseISO(today())) / 864e5);
const fmtD = s => s ? s.split('-').reverse().join('/') : '—';
const WD = ['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sáb'];
const WD_FULL = ['domingo', 'segunda', 'terça', 'quarta', 'quinta', 'sexta', 'sábado'];
const fmtDW = s => s ? `${WD[parseISO(s).getDay()]}, ${fmtD(s)}` : '—';
const MONTHS = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
const fmtMonth = ym => ym ? `${MONTHS[Number(ym.slice(5, 7)) - 1]} de ${ym.slice(0, 4)}` : '';
const num = v => { const n = parseFloat(String(v ?? '').replace(/\./g, (m, i, s) => s.includes(',') ? '' : '.').replace(',', '.')); return isNaN(n) ? 0 : n; };
const money = n => (Number(n) || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
const sum = (arr, f) => arr.reduce((a, x) => a + num(f(x)), 0);
const digits = s => String(s || '').replace(/\D/g, '');
function age(n) {
  if (!n) return null;
  const b = parseISO(n), t = new Date();
  let a = t.getFullYear() - b.getFullYear();
  const m = t.getMonth() - b.getMonth();
  if (m < 0 || (m === 0 && t.getDate() < b.getDate())) a--;
  return a;
}
const isMinor = p => { const a = age(p.nasc); return a !== null && a < 18; };
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 2200); }
async function download(name, text, type = 'application/json') {
  if (dlCap) {
    try { await dlCap.save({ filename: name, data: text }); return true; }
    catch (e) { if (e?.code !== 'declined') notice('Não foi possível baixar o arquivo.', 'Tente de novo em alguns segundos.'); return false; }
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type }));
  a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  return true;
}

/* caixas de confirmação dentro da página (o visualizador do claude.ai não mostra alert/confirm/prompt) */
function ask(o) {
  return new Promise(res => {
    const d = $('#dlg2');
    d.innerHTML = `<form class="dlg"><h2>${esc(o.title)}</h2>${o.text ? `<p class="pre">${esc(o.text)}</p>` : ''}
      ${o.typeWord ? `<label class="fld"><span>Para confirmar, digite ${esc(o.typeWord)}</span><input name="w" autocomplete="off" autocapitalize="characters"></label>` : ''}
      ${o.input ? `<label class="fld"><span>${esc(o.input.label)}</span><input name="v" type="${o.input.type || 'text'}" autocomplete="off"></label>` : ''}
      <div class="err"></div>
      <div class="foot">${o.alertOnly ? '' : `<button type="button" class="btn" data-x>${esc(o.cancel || 'Cancelar')}</button>`}<button class="btn ${o.danger ? 'dangerfill' : 'primary'}">${esc(o.ok || 'OK')}</button></div></form>`;
    const f = $('form', d); let done = false;
    const fin = v => { if (done) return; done = true; d.close(); res(v); };
    $('[data-x]', f)?.addEventListener('click', () => fin(o.input ? null : false));
    d.oncancel = e => { e.preventDefault(); fin(o.input ? null : false); };
    f.onsubmit = e => {
      e.preventDefault();
      if (o.typeWord && f.w.value.trim().toUpperCase() !== o.typeWord) { $('.err', f).textContent = 'O texto digitado não confere.'; return; }
      fin(o.input ? f.v.value : true);
    };
    d.showModal();
    ($('input', f) || $('button.primary, button.dangerfill', f))?.focus();
  });
}
const notice = (title, text = '') => ask({ title, text, ok: 'OK', alertOnly: true });
/* WhatsApp: número com DDD (com ou sem +55) vira link direto para a conversa */
function waLink(phone) {
  const d = digits(phone).replace(/^0+/, '');
  if (/^\s*\+/.test(phone)) return d.length >= 8 ? `https://wa.me/${d}` : '';  // com "+": já tem o código do país
  if (d.length < 10) return '';
  return `https://wa.me/${d.length <= 11 ? '55' + d : d}`;
}
function phoneHTML(phone) {
  if (!phone) return '';
  const w = waLink(phone);
  return `<span class="phone">${esc(phone)}</span>${w ? ` <a class="wa" href="${w}" target="_blank" rel="noopener" title="Abrir conversa no WhatsApp">WhatsApp</a>` : ''}`;
}

/* valor por extenso (recibos) */
const U = ['', 'um', 'dois', 'três', 'quatro', 'cinco', 'seis', 'sete', 'oito', 'nove', 'dez', 'onze', 'doze', 'treze', 'quatorze', 'quinze', 'dezesseis', 'dezessete', 'dezoito', 'dezenove'];
const T = ['', '', 'vinte', 'trinta', 'quarenta', 'cinquenta', 'sessenta', 'setenta', 'oitenta', 'noventa'];
const H = ['', 'cento', 'duzentos', 'trezentos', 'quatrocentos', 'quinhentos', 'seiscentos', 'setecentos', 'oitocentos', 'novecentos'];
function ext3(n) {
  if (n === 100) return 'cem';
  const w = [], c = Math.floor(n / 100), r = n % 100;
  if (c) w.push(H[c]);
  if (r > 0 && r < 20) w.push(U[r]);
  else if (r >= 20) w.push(T[Math.floor(r / 10)] + (r % 10 ? ' e ' + U[r % 10] : ''));
  return w.join(' e ');
}
function extInt(x) {
  const m = Math.floor(x / 1e6), k = Math.floor(x / 1000) % 1000, r = x % 1000, parts = [];
  if (m) parts.push(m === 1 ? 'um milhão' : ext3(m) + ' milhões');
  if (k) parts.push(k === 1 ? 'mil' : ext3(k) + ' mil');
  if (r) parts.push(ext3(r));
  if (parts.length < 2) return parts[0] || '';
  const last = parts.pop();
  return parts.join(', ') + ((r && (r <= 100 || r % 100 === 0)) ? ' e ' : ' ') + last;
}
function extenso(v) {
  const n = Math.round(num(v) * 100), reais = Math.floor(n / 100), cent = n % 100, out = [];
  if (reais) out.push(extInt(reais) + (reais === 1 ? ' real' : (reais % 1e6 === 0 ? ' de reais' : ' reais')));
  if (cent) out.push(ext3(cent) + (cent === 1 ? ' centavo' : ' centavos'));
  return out.join(' e ') || 'zero real';
}

/* ---------- constantes de domínio ---------- */
const P_STATUS = { ativo: 'Ativo', pausa: 'Em pausa', alta: 'Alta', inativo: 'Inativo' };
const S_STATUS = { agendado: 'Agendado', realizado: 'Realizado', falta: 'Falta', cancelado: 'Cancelado', reagendado: 'Reagendado' };
const S_BADGE = { agendado: 'info', realizado: 'ok', falta: 'bad', cancelado: 'warn', reagendado: 'acc' };
const PAY_FORMS = ['Pix', 'Dinheiro', 'Cartão de crédito', 'Cartão de débito', 'Transferência bancária', 'Boleto', 'Convênio', 'Outro'];
const NF_STATUS = { pendente: 'A emitir', emitida: 'Emitida', cancelada: 'Cancelada' };
const NF_BADGE = { pendente: 'warn', emitida: 'ok', cancelada: '' };
const REC_TIPOS = ['Evolução de sessão', 'Anamnese', 'Avaliação', 'Devolutiva', 'Contato com responsáveis', 'Contato com escola/rede', 'Documento emitido', 'Encaminhamento', 'Supervisão', 'Outro'];
const MEIOS = ['WhatsApp', 'Telefone', 'Presencial', 'Videochamada', 'E-mail'];
const PARENTESCO = ['Mãe', 'Pai', 'Avó', 'Avô', 'Tia', 'Tio', 'Irmã(o)', 'Madrasta', 'Padrasto', 'Tutor(a) legal', 'Outro'];
const META_STATUS = { nao: 'Não iniciada', andamento: 'Em andamento', alcancada: 'Alcançada', suspensa: 'Revista / suspensa' };
const META_BADGE = { nao: '', andamento: 'info', alcancada: 'ok', suspensa: 'warn' };
const STUDY = [
  ['contexto', 'Identificação e contexto'], ['queixa', 'Queixa principal / demanda'],
  ['historiaQueixa', 'História da queixa atual'], ['historiaVida', 'História de vida e desenvolvimento'],
  ['familia', 'Dinâmica familiar e rede de apoio'], ['social', 'Contexto escolar, profissional e social'],
  ['observacoes', 'Observações clínicas e comportamentais'], ['avaliacao', 'Instrumentos e avaliações realizadas'],
  ['hipoteses', 'Hipóteses diagnósticas / diagnóstico'], ['formulacao', 'Formulação / compreensão do caso'],
  ['referencial', 'Referencial teórico'], ['riscoProtecao', 'Fatores de risco e de proteção'],
  ['supervisao', 'Discussão / supervisão'], ['evolucao', 'Evolução observada'],
];
const PLAN = [
  { t: 'section', l: 'Estrutura' },
  { k: 'abordagem', l: 'Abordagem terapêutica' },
  { k: 'frequencia', l: 'Frequência das sessões', ph: 'Ex.: semanal, 50 min' },
  { k: 'inicio', l: 'Início do plano', t: 'date' },
  { k: 'revisao', l: 'Próxima revisão do plano', t: 'date' },
  { k: 'duracao', l: 'Duração estimada', ph: 'Ex.: 6 meses' },
  { k: 'modalidade', l: 'Modalidade', t: 'select', empty: true, opts: ['Presencial', 'Online', 'Híbrido'] },
  { t: 'section', l: 'Objetivos e intervenções' },
  { k: 'objetivoGeral', l: 'Objetivo geral', t: 'textarea', rows: 3 },
  { k: 'intervencoes', l: 'Estratégias, técnicas e recursos', t: 'textarea', rows: 4 },
  { k: 'familia', l: 'Participação dos responsáveis / família', t: 'textarea', rows: 3 },
  { k: 'encaminhamentos', l: 'Encaminhamentos e articulação com a rede', t: 'textarea', rows: 3, ph: 'Psiquiatria, fono, escola, etc.' },
  { k: 'criteriosAlta', l: 'Critérios de alta', t: 'textarea', rows: 3 },
];

/* ---------- dados ---------- */
function emptyDB() {
  return { v: 1, patients: [], sessions: [], payments: [], invoices: [], contacts: [], records: [], settings: {} };
}
function migrate(d) {
  for (const k of ['patients', 'sessions', 'payments', 'invoices', 'contacts', 'records', 'repassesPagos']) if (!Array.isArray(d[k])) d[k] = [];
  d.settings = Object.assign({ nome: '', crp: '', cpf: '', telefone: '', email: '', endereco: '', cidade: '', valorPadrao: '', duracaoPadrao: 50, descricaoNF: 'Serviços de psicologia (psicoterapia)', linkNF: NFSE_NACIONAL, gcalPrefixo: 'Sessão', gcalTitulo: 'iniciais' }, d.settings || {});
  if (!Array.isArray(d.settings.plataformas)) d.settings.plataformas = [];
  if (!d.settings.platSeed) {  // plataformas padrão desta versão (uma vez só; se excluídas, não voltam)
    d.settings.platSeed = 1;
    const has = n => d.settings.plataformas.some(x => String(x.nome || '').toLowerCase().includes(n.toLowerCase().split(' ')[0]));
    for (const pl of APP.plataformasPadrao) if (!has(pl.nome)) d.settings.plataformas.push(JSON.parse(JSON.stringify(pl)));
  }
  for (const p of d.patients) { p.responsaveis ||= []; p.series ||= []; p.docs ||= []; p.estudo ||= {}; p.plano ||= {}; p.plano.metas ||= []; }
  return d;
}
const P = id => db.patients.find(p => p.id === id);
const sessOf = id => db.sessions.filter(s => s.pacienteId === id);
const paysOf = id => db.payments.filter(p => p.pacienteId === id);
const invsOf = id => db.invoices.filter(i => i.pacienteId === id);
const bySess = (a, b) => (a.data + (a.hora || '')).localeCompare(b.data + (b.hora || ''));
const billable = s => s.status === 'realizado' || ((s.status === 'falta' || s.status === 'cancelado') && s.cobrar);
/* repasse: valor que a psicóloga paga à plataforma que indicou o paciente, por atendimento cobrado.
   Cada sessão guarda o valor e a plataforma da época (s.repasse, s.plataformaId); sessões antigas,
   sem esse registro, usam a regra atual do paciente. */
const PLAT = id => (db.settings.plataformas || []).find(x => x.id === id);
const hasVal = v => v !== '' && v != null;
function repasseRate(p, valor) {
  const pl = PLAT(p?.plataformaId); if (!pl) return 0;
  if (hasVal(p.repasse)) return num(p.repasse);
  if (pl.tipo === 'faixas') {  // a última faixa cujo "a partir de" o valor da sessão alcança
    const f = (pl.faixas || []).filter(x => num(valor) >= num(x.de) - 1e-9).sort((a, b) => num(a.de) - num(b.de)).pop();
    if (!f) return 0;
    return f.tipo === 'percentual' ? Math.round(num(valor) * num(f.valor)) / 100 : num(f.valor);
  }
  return pl.tipo === 'percentual' ? Math.round(num(valor) * num(pl.valor)) / 100 : num(pl.valor);
}
const platOf = s => s.plataformaId !== undefined ? s.plataformaId : P(s.pacienteId)?.plataformaId;
const repasseOf = s => !billable(s) || !platOf(s) ? 0 : hasVal(s.repasse) ? num(s.repasse) : repasseRate(P(s.pacienteId), s.valor);  // plataformaId '' = atendimento sem plataforma

const semRepasse = p => !p.plataformaId ? [] : sessOf(p.id).filter(s => s.status !== 'agendado' && !s.repasseManual && (s.plataformaId || '') !== p.plataformaId);
function refreshFutureRepasse(p) { sessOf(p.id).filter(s => s.status === 'agendado' && s.data >= today()).forEach(s => stampRepasse(s, p)); }
const pct = v => `${String(num(v)).replace('.', ',')}%`;
function faixaTxt(f) { return num(f.valor) === 0 ? 'não cobra' : f.tipo === 'percentual' ? pct(f.valor) : money(f.valor); }
function platRegra(pl) {
  if (pl.tipo === 'faixas') {
    const fs = (pl.faixas || []).slice().sort((a, b) => num(a.de) - num(b.de));
    if (!fs.length) return 'faixas não definidas';
    return fs.map((f, i) => { const nx = fs[i + 1];
      const rng = nx ? (num(f.de) === 0 ? `até ${money(num(nx.de) - 0.01)}` : `${money(f.de)} a ${money(num(nx.de) - 0.01)}`) : `a partir de ${money(f.de)}`;
      return `${rng}: ${faixaTxt(f)}`; }).join(' · ');

}
function repasseResumo(month) {  // por plataforma: devido, pago, saldo e do mês
  return (db.settings.plataformas || []).map(pl => {
    const ss = db.sessions.filter(s => platOf(s) === pl.id && billable(s));
    const devido = sum(ss, repasseOf), pago = sum(db.repassesPagos.filter(r => r.plataformaId === pl.id), r => r.valor);
    const mes = sum(ss.filter(s => s.data.startsWith(month)), repasseOf);
    const pacientes = db.patients.filter(p => p.plataformaId === pl.id && p.status === 'ativo').length;

}
function balance(pid) {
  const due = sum(sessOf(pid).filter(billable), s => s.valor), paid = sum(paysOf(pid), p => p.valor);
  return { due, paid, bal: due - paid };
}
const invoiceOf = payId => db.invoices.find(i => i.status !== 'cancelada' && (i.pagamentos || []).includes(payId));
const nextSession = pid => sessOf(pid).filter(s => s.status === 'agendado' && s.data >= today()).sort(bySess)[0];
const financeiro = p => p.responsaveis.find(r => r.financeiro) || p.responsaveis[0];
function contactInfo(p) {
  const cs = db.contacts.filter(c => c.pacienteId === p.id).sort((a, b) => b.data.localeCompare(a.data));
  const last = cs[0];
  const next = last ? (last.proximo || addMonths(last.data, 1)) : addMonths(p.inicio || (p.criadoEm || today()).slice(0, 10), 1);
  return { last, next, dias: daysUntil(next), list: cs };
}
const needsContact = p => p.status === 'ativo' && isMinor(p);
function payer(p) {
  if (isMinor(p) && p.responsaveis.length) { const r = financeiro(p); return { nome: r.nome, cpf: r.cpf, endereco: r.endereco || p.endereco, email: r.email }; }

/* ---------- criptografia ---------- */
const enc = new TextEncoder(), dec = new TextDecoder();
function b64e(buf) { const b = new Uint8Array(buf); let s = ''; for (let i = 0; i < b.length; i += 0x8000) s += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000)); return btoa(s); }

}
async function sealVault(data, k, s) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, k, enc.encode(JSON.stringify(data)));
  return { app: 'duda-pacientes', v: 1, salt: b64e(s), iv: b64e(iv), ct: b64e(ct) };
}
async function openVault(vault, pw) {
  const s = b64d(vault.salt), k = await deriveKey(pw, s);
  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64d(vault.iv) }, k, b64d(vault.ct));
  return { data: JSON.parse(dec.decode(pt)), key: k, salt: s };

/* Armazenamento (formato 2). Os dados são divididos em partes: "core" (configurações) e uma parte por
   paciente. Cada parte é criptografada separadamente, então cada alteração salva e envia só o que mudou.
   Cópia local no IndexedDB (sem o limite de ~5 MB do localStorage) e, na página do claude.ai,
   sincronização numa área privada da conta (capability db). Só texto criptografado sai do aparelho. */
let cloud = null, cloudUid = null, dlCap = null;
const CHUNK = 180000;
const capsReady = (async () => {
  if (!window.claude?.use) return;
  try {
    const [d, u, dl] = await Promise.all([claude.use('db'), claude.use('user'), claude.use('downloads')]);
    dlCap = dl;
    const id = u ? await u.id() : null;
    if (d && id) { cloud = d; cloudUid = id; }
  } catch {}
})();

/* cópia local: IndexedDB, com localStorage como reserva */
const kv = (() => {
  const LS = `${APP.chave}.v2.`;
  let idb = null, useLS = false;
  const open = () => idb ??= new Promise((res, rej) => {
    try {
      const r = indexedDB.open(`${APP.chave}-consultorio`, 1);
      r.onupgradeneeded = () => r.result.createObjectStore('kv');
      r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
    } catch (e) { rej(e); }
  });
  async function withStore(mode, fn) {
    const d = await open();
    return new Promise((res, rej) => {
      const t = d.transaction('kv', mode), r = fn(t.objectStore('kv'));
      t.oncomplete = () => res(r ? r.result : undefined);
      t.onerror = t.onabort = () => rej(t.error || new Error('idb'));
    });
  }
  return {
    async get(k) {
      if (!useLS) { try { return await withStore('readonly', st => st.get(k)); } catch { useLS = true; } }
      try { return JSON.parse(localStorage.getItem(LS + k) || 'null') ?? undefined; } catch { return undefined; }
    },
    async write(puts, dels = []) {
      if (!useLS) {
        try { await withStore('readwrite', st => { for (const [k, v] of Object.entries(puts)) st.put(v, k); for (const k of dels) st.delete(k); }); return; }
        catch { useLS = true; }
      }
      for (const [k, v] of Object.entries(puts)) localStorage.setItem(LS + k, JSON.stringify(v));
      for (const k of dels) localStorage.removeItem(LS + k);
    },
    async clear() {
      try { await withStore('readwrite', st => { st.clear(); }); } catch {}
      try { Object.keys(localStorage).filter(k => k.startsWith(LS)).forEach(k => localStorage.removeItem(k)); } catch {}

let idx = null;               // índice: {fmt, salt, saltAt, check, parts: {id: savedAt}, dead: {id: quando foi apagado}, savedAt}
let savedJSON = {};           // id da parte -> JSON aberto da última versão salva
let partSize = {};            // id da parte -> tamanho criptografado
let cloudQueue = new Map();   // id -> parte criptografada a enviar, ou null para apagar
let cloudTimer = null, cloudBusy = false, cloudSeen = 0, legacyCleanup = false, persisting = Promise.resolve();

const PART_KEYS = ['sessions', 'payments', 'invoices', 'contacts', 'records'];
const partId = pid => 'p-' + String(pid).replace(/[^A-Za-z0-9_-]/g, '_');
function splitDB(d) {
  const parts = { core: { v: d.v, settings: d.settings, atualizadoEm: d.atualizadoEm, repassesPagos: d.repassesPagos } }, by = {};
  for (const p of d.patients) by[p.id] = parts[partId(p.id)] = { patient: p, sessions: [], payments: [], invoices: [], contacts: [], records: [] };
  for (const k of PART_KEYS) for (const r of d[k]) by[r.pacienteId]?.[k].push(r);
  return parts;
}
function joinDB(parts) {
  const d = emptyDB(), c = parts.core || {};
  d.settings = c.settings || {}; d.atualizadoEm = c.atualizadoEm; d.repassesPagos = c.repassesPagos || [];
  for (const [id, x] of Object.entries(parts)) {
    if (id === 'core' || !x?.patient) continue;
    d.patients.push(x.patient);
    for (const k of PART_KEYS) d[k].push(...(x[k] || []));
  }
  return migrate(d);
}
async function encPart(text, k = key) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, k, enc.encode(text));
  return { iv: b64e(iv), ct: b64e(ct) };
}
async function decPart(e, k = key) { return dec.decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64d(e.iv) }, k, b64d(e.ct))); }
async function newIndex(prev) {
  const now = Date.now();
  return { fmt: 2, parts: {}, dead: {}, ...(prev || {}), salt: b64e(salt), saltAt: now, check: await encPart('consultorio-ok'), savedAt: now };
}
function mergeIndex(a, b) {
  if (!a) return b; if (!b) return a;
  const base = (b.saltAt || 0) >= (a.saltAt || 0) ? b : a;
  const out = { ...base, parts: {}, dead: { ...(a.dead || {}) }, savedAt: Math.max(a.savedAt || 0, b.savedAt || 0) };
  for (const [id, t] of Object.entries(b.dead || {})) out.dead[id] = Math.max(out.dead[id] || 0, t);
  for (const src of [a, b]) for (const [id, t] of Object.entries(src.parts || {})) out.parts[id] = Math.max(out.parts[id] || 0, t);
  for (const [id, t] of Object.entries(out.dead)) { if ((out.parts[id] || 0) <= t) delete out.parts[id]; else delete out.dead[id]; }

/* nuvem: índice "i", uma ficha "m-<parte>" por parte e, para partes grandes, pedaços "x-<parte>-<versão>-<n>" */
const cbase = () => `data/users/${cloudUid}`;
const cpath = id => `${cbase()}/${id}`;
async function cloudGetIndex() { const s = await cloud.doc(cpath('i')).get(); return s.exists ? s.data() : null; }
async function cloudGetPart(id) {
  const m = await cloud.doc(cpath('m-' + id)).get();
  if (!m.exists) return null;
  const meta = m.data(); let ct = meta.d || '';
  for (let i = 0; i < (meta.n || 0); i++) {
    const c = await cloud.doc(cpath(`x-${id}-${meta.ver}-${i}`)).get();
    if (!c.exists) throw new Error('parte incompleta');
    ct += c.data().d;
  }
  return { iv: meta.iv, ct, savedAt: meta.savedAt };
}
async function cloudDelChunks(id, meta) { for (let i = 0; i < (meta?.n || 0); i++) { try { await cloud.doc(cpath(`x-${id}-${meta.ver}-${i}`)).delete(); } catch {} } }
async function cloudPutPart(id, e) {
  const mp = cpath('m-' + id), old = (await cloud.doc(mp).get()).data?.();
  let meta;
  if (e.ct.length <= CHUNK) meta = { iv: e.iv, savedAt: e.savedAt, n: 0, d: e.ct };
  else {
    const ver = Date.now().toString(36) + Math.random().toString(36).slice(2, 6), n = Math.ceil(e.ct.length / CHUNK);
    for (let i = 0; i < n; i++) await cloud.doc(cpath(`x-${id}-${ver}-${i}`)).set({ d: e.ct.slice(i * CHUNK, (i + 1) * CHUNK) });
    meta = { iv: e.iv, savedAt: e.savedAt, n, ver };
  }
  await cloud.doc(mp).set(meta);
  if (old?.n && old.ver !== meta.ver) await cloudDelChunks(id, old);
}
async function cloudDelPart(id) {
  const mp = cpath('m-' + id), old = (await cloud.doc(mp).get()).data?.();
  await cloud.doc(mp).delete();
  await cloudDelChunks(id, old);
}
async function cloudWipe() {
  const all = await cloud.collection(cbase()).get();
  for (const d of all.docs) { try { await cloud.doc(cpath(d.id)).delete(); } catch {} }
}
/* anexos: cada arquivo tem a própria chave (guardada na ficha do paciente, que é protegida pela senha)
   e é gravado uma vez só, à parte: "fm-<id>" com o tamanho e pedaços "fx-<id>-<n>" na nuvem, "file:<id>" no aparelho */
let fileQueue = new Map();   // id do anexo -> conteúdo criptografado a enviar, ou null para apagar
async function cloudPutFile(id, ct) {
  const n = Math.max(1, Math.ceil(ct.length / CHUNK));
  for (let i = 0; i < n; i++) await cloud.doc(cpath(`fx-${id}-${i}`)).set({ d: ct.slice(i * CHUNK, (i + 1) * CHUNK) });
  await cloud.doc(cpath('fm-' + id)).set({ n, len: ct.length });
}
async function cloudGetFile(id) {
  const m = await cloud.doc(cpath('fm-' + id)).get();
  if (!m.exists) return null;
  let ct = '';
  for (let i = 0; i < m.data().n; i++) { const c = await cloud.doc(cpath(`fx-${id}-${i}`)).get(); if (!c.exists) return null; ct += c.data().d; }
  return ct;
}
async function cloudDelFile(id) {
  const m = await cloud.doc(cpath('fm-' + id)).get();
  if (!m.exists) return;
  await cloud.doc(cpath('fm-' + id)).delete();
  for (let i = 0; i < m.data().n; i++) { try { await cloud.doc(cpath(`fx-${id}-${i}`)).delete(); } catch {} }
}
async function queueFile(id, ct) {  // ct = null apaga
  const puts = {}, dels = [];
  if (ct != null) puts['file:' + id] = { ct }; else dels.push('file:' + id);
  if (cloud) { fileQueue.set(id, ct); const q = (await kv.get('fileq')) || {}; q[id] = ct != null ? 'up' : 'del'; puts.fileq = q; }
  await kv.write(puts, dels);
  if (cloud) scheduleCloud();
}
async function restoreFileQueue() {  // envios que ficaram pendentes (página fechada antes de terminar)
  if (!cloud) return;
  const q = (await kv.get('fileq')) || {};
  for (const [id, op] of Object.entries(q)) {
    if (op === 'del') fileQueue.set(id, null);
    else { const r = await kv.get('file:' + id); if (r) fileQueue.set(id, r.ct); }
  }
  if (fileQueue.size) scheduleCloud();
}
async function getFileCt(id) {
  const r = await kv.get('file:' + id);
  if (r) return r.ct;
  if (!cloud) return null;
  const ct = await cloudGetFile(id);
  if (ct) { try { await kv.write({ ['file:' + id]: { ct } }); } catch {} }
  return ct;
}

/* formato antigo (um só cofre), lido uma vez para converter */
function legacyLocal() { try { return JSON.parse(localStorage.getItem(STORE) || 'null'); } catch { return null; } }
async function legacyCloud() {
  const m = await cloud.doc(cpath('vault')).get();
  if (!m.exists) return null;
  const meta = m.data(); let ct = '';
  for (let i = 0; i < meta.n; i++) { const c = await cloud.doc(cpath(`c-${meta.ver}-${i}`)).get(); if (!c.exists) throw new Error('cofre incompleto'); ct += c.data().d; }
  return { salt: meta.salt, iv: meta.iv, ct, savedAt: meta.savedAt };
}

function setSync(state) {
  const el = $('#sync'); if (!el) return;
  el.textContent = { local: 'salvo neste aparelho', saving: 'sincronizando…', ok: '☁︎ sincronizado', err: '⚠ sem sincronizar' }[state];
  el.className = 'sync' + (state === 'err' ? ' bad' : '');
  el.title = state === 'err' ? 'Os dados estão salvos neste aparelho e serão enviados assim que a conexão voltar.' : '';
}
function scheduleCloud() {
  setSync('saving');
  clearTimeout(cloudTimer); cloudTimer = setTimeout(flushCloud, 1200);
}
async function flushCloud() {
  if (!cloud || !idx) return;
  if (cloudBusy) { clearTimeout(cloudTimer); cloudTimer = setTimeout(flushCloud, 800); return; }
  if (!cloudQueue.size && !fileQueue.size) return;
  cloudBusy = true; setSync('saving');
  const batch = [...cloudQueue]; cloudQueue = new Map();
  const fbatch = [...fileQueue]; fileQueue = new Map();
  let lockMsg = '';
  try {
    // anexos primeiro: quando a ficha que os cita chegar ao outro aparelho, o arquivo já está lá
    for (const [id, ct] of fbatch) { if (ct != null) await cloudPutFile(id, ct); else await cloudDelFile(id); }
    if (fbatch.length) {
      const q = (await kv.get('fileq')) || {};
      for (const [id] of fbatch) if (!fileQueue.has(id)) delete q[id];
      try { await kv.write({ fileq: q }); } catch {}
    }
    if (batch.length) {
      const ci = await cloudGetIndex();
      if (ci && ci.salt !== idx.salt && (ci.saltAt || 0) > (idx.saltAt || 0)) { lockMsg = 'A senha foi alterada em outro aparelho. Entre com a nova senha.'; return; }
      for (const [id, e] of batch) { if (e) await cloudPutPart(id, e); else await cloudDelPart(id); }
      const merged = mergeIndex(ci, idx);
      await cloud.doc(cpath('i')).set(merged);
      cloudSeen = merged.savedAt;
    }
    if (legacyCleanup) {
      legacyCleanup = false;
      try { const all = await cloud.collection(cbase()).get(); for (const d of all.docs) if (d.id === 'vault' || d.id.startsWith('c-')) await cloud.doc(cpath(d.id)).delete(); } catch {}
    }
    setSync(cloudQueue.size || fileQueue.size ? 'saving' : 'ok');
  } catch {
    for (const [id, e] of batch) if (!cloudQueue.has(id)) cloudQueue.set(id, e);
    for (const [id, ct] of fbatch) if (!fileQueue.has(id)) fileQueue.set(id, ct);
    setSync('err'); clearTimeout(cloudTimer); cloudTimer = setTimeout(flushCloud, 15000);
    return;
  } finally {
    cloudBusy = false;
    if (lockMsg) showLock(lockMsg);
  }
  if (cloudQueue.size || fileQueue.size) scheduleCloud();
}

/* salva só as partes que mudaram desde a última vez */
function persist() { return persisting = persisting.then(persistNow, persistNow); }
async function persistNow() {
  if (!db || !key || !idx) return;
  const parts = splitDB(db), now = Date.now(), puts = {}, dels = [];
  for (const [id, x] of Object.entries(parts)) {
    const json = JSON.stringify(x);
    if (savedJSON[id] === json) continue;
    const e = { ...(await encPart(json)), savedAt: now };
    puts['part:' + id] = e; idx.parts[id] = now; delete idx.dead[id];
    savedJSON[id] = json; partSize[id] = e.ct.length;
    if (cloud) cloudQueue.set(id, e);
  }
  for (const id of Object.keys(savedJSON)) if (!(id in parts)) {
    delete savedJSON[id]; delete partSize[id]; delete idx.parts[id]; idx.dead[id] = now;
    dels.push('part:' + id);
    if (cloud) cloudQueue.set(id, null);
  }
  if (!Object.keys(puts).length && !dels.length) return;
  idx.savedAt = now; puts.index = idx;
  let localOk = true;
  try { await kv.write(puts, dels); } catch { localOk = false; }
  if (cloud) scheduleCloud();
  else if (!localOk) notice('Não foi possível salvar', 'O armazenamento do navegador está cheio ou bloqueado. Faça um backup agora em Configurações.');
  else setSync('local');
}

/* abre os dados: junta a cópia do aparelho e a da conta, ficando com a versão mais nova de cada parte */
async function loadAll(pw, info) {
  const { li, ci } = info;
  const main = ci && (!li || (ci.saltAt || 0) > (li.saltAt || 0)) ? ci : li;
  const s = b64d(main.salt), k = await deriveKey(pw, s);
  try { await decPart(main.check, k); } catch { throw new Error('senha'); }
  const useLocal = li && li.salt === main.salt, useCloud = ci && ci.salt === main.salt;
  const merged = mergeIndex(useLocal ? li : null, useCloud ? ci : null);
  const parts = {}, toLocal = {}, sj = {}, sz = {}, queue = new Map(); let missing = 0;
  for (const id of Object.keys(merged.parts || {})) {
    const lrec = useLocal ? await kv.get('part:' + id) : null;
    const ct = useCloud ? (ci.parts?.[id] || 0) : 0;
    let rec = null, from = '';
    if (lrec && (lrec.savedAt || 0) >= ct) { rec = lrec; from = 'local'; }
    else if (cloud && ct) { try { rec = await cloudGetPart(id); from = 'cloud'; } catch {} if (!rec && lrec) { rec = lrec; from = 'local'; } }
    let json = null;
    if (rec) { try { json = await decPart(rec, k); } catch {} }
    if (json == null && from === 'cloud' && lrec) { try { json = await decPart(lrec, k); rec = lrec; from = 'local'; } catch {} }
    if (json == null) { missing++; continue; }
    parts[id] = JSON.parse(json); sj[id] = json; sz[id] = rec.ct.length;
    if (from === 'cloud') toLocal['part:' + id] = rec;
    else if (cloud && (!ct || ct < (rec.savedAt || 0))) queue.set(id, rec);
  }
  key = k; salt = s;
  idx = { ...merged, salt: main.salt, saltAt: main.saltAt, check: main.check, parts: { ...(merged.parts || {}) }, dead: { ...(merged.dead || {}) } };
  savedJSON = sj; partSize = sz; cloudQueue = queue; cloudSeen = useCloud ? (ci.savedAt || 0) : 0;
  db = joinDB(parts);
  toLocal.index = idx;
  try { await kv.write(toLocal); } catch {}
  if (cloud && queue.size) scheduleCloud();
  return missing;
}

/* ao voltar para a aba, busca alterações feitas em outro aparelho */
document.addEventListener('visibilitychange', async () => {
  if (document.visibilityState !== 'visible' || !cloud || !db || !idx || cloudBusy || cloudQueue.size || $('#dlg').open) return;
  try {
    await persisting;
    const ci = await cloudGetIndex();
    if (!ci || (ci.savedAt || 0) <= cloudSeen) return;
    if (ci.salt !== idx.salt) { showLock('A senha foi alterada em outro aparelho. Entre com a nova senha.'); return; }
    const parts = splitDB(db), toLocal = {}, dels = []; let changed = false;
    for (const [id, t] of Object.entries(ci.parts || {})) {
      if (t <= (idx.parts[id] || 0)) continue;
      const rec = await cloudGetPart(id); if (!rec) continue;
      const json = await decPart(rec);
      parts[id] = JSON.parse(json); savedJSON[id] = json; partSize[id] = rec.ct.length; idx.parts[id] = rec.savedAt;
      toLocal['part:' + id] = rec; changed = true;
    }
    for (const [id, t] of Object.entries(ci.dead || {})) {
      if (!(id in parts) || t < (idx.parts[id] || 0)) continue;
      delete parts[id]; delete savedJSON[id]; delete partSize[id]; delete idx.parts[id]; idx.dead[id] = t;
      dels.push('part:' + id); changed = true;
    }
    cloudSeen = ci.savedAt;
    if (!changed) return;
    db = joinDB(parts);
    toLocal.index = idx;
    try { await kv.write(toLocal, dels); } catch {}
    render(); applyAppearance(); toast('Atualizado com as alterações de outro aparelho.');
  } catch {}
});

let pendingImport = null, pendingFiles = null;
document.addEventListener('submit', async e => {
  const f = e.target;
  if (f.id === 'unlockForm') {
    e.preventDefault();
    const btn = $('button', f); btn.disabled = true; $('#lockErr').textContent = '';
    const info = unlockInfo;
    try {
      if (info.legacy) {

        key = r.key; salt = r.salt; db = migrate(r.data);

        start(); await persist();

      } else {
        const missing = await loadAll(f.pw.value, info);

    salt = crypto.getRandomValues(new Uint8Array(16));
    key = await deriveKey(f.pw1.value, salt);
    db = migrate(pendingImport || emptyDB()); pendingImport = null;
    const files = pendingFiles; pendingFiles = null;
    idx = await newIndex(); savedJSON = {}; partSize = {}; cloudQueue = new Map();
    curRoute = db.settings.nome ? 'inicio' : 'config';

});

function optsHTML(opts, v) {

}
function fieldHTML(f, v) {
  if (f.t === 'section') return `<h3 class="full sec">${esc(f.l)}</h3>`;
  const full = (f.w === 'full' || f.t === 'textarea') ? ' full' : '';
  const req = f.req ? ' required' : '';
  const lab = `<span>${esc(f.l)}${f.req ? ' *' : ''}</span>`;
  const hint = f.hint ? `<small>${esc(f.hint)}</small>` : '';
  switch (f.t) {
    case 'textarea': return `<label class="fld${full}">${lab}<textarea name="${f.k}" rows="${f.rows || 4}"${req} placeholder="${esc(f.ph || '')}">${esc(v ?? '')}</textarea>${hint}</label>`;
    case 'select': return `<label class="fld${full}">${lab}<select name="${f.k}"${req}>${f.empty ? '<option value="">—</option>' : ''}${optsHTML(f.opts, v)}</select>${hint}</label>`;
    case 'checkbox': return `<label class="check full"><input type="checkbox" name="${f.k}"${v ? ' checked' : ''}> ${esc(f.l)}</label>`;
    case 'checks': return `<div class="fld full">${lab}<div class="checks">${f.opts.length ? f.opts.map(([ov, ol]) => `<label class="check"><input type="checkbox" name="${f.k}" value="${esc(ov)}"${(v || []).includes(ov) ? ' checked' : ''}> ${esc(ol)}</label>`).join('') : '<span class="muted">Nenhum item disponível.</span>'}</div>${hint}</div>`;
    case 'faixas': {
      const rows = [...(v || []), ...Array(Math.max(0, 5 - (v || []).length)).fill({})].slice(0, 5);
      return `<div class="fld full" data-faixas="${f.k}">${lab}<div class="tw"><table class="faixas"><thead><tr><th>A partir de (R$)</th><th>Cobra</th><th>Valor</th></tr></thead><tbody>${rows.map((r, i) => `<tr>
        <td><input name="${f.k}_de_${i}" inputmode="decimal" placeholder="${i ? '' : '0,00'}" value="${hasVal(r.de) ? esc(String(r.de).replace('.', ',')) : ''}"></td>

    }

    case 'money': return `<label class="fld${full}">${lab}<input name="${f.k}" inputmode="decimal" placeholder="0,00" value="${v === '' || v == null ? '' : esc(String(v).replace('.', ','))}"${req}>${hint}</label>`;
    default: return `<label class="fld${full}">${lab}<input type="${f.t || 'text'}" name="${f.k}" value="${esc(v ?? '')}"${req}${f.t === 'number' ? ' step="any"' : ''} placeholder="${esc(f.ph || '')}">${hint}</label>`;

}
function readForm(form, fields) {
  const o = {};
  for (const f of fields) {
    if (!f.k) continue;
    if (f.t === 'checkbox') o[f.k] = !!form.querySelector(`[name="${f.k}"]`)?.checked;
    else if (f.t === 'faixas') {
      o[f.k] = [];
      for (let i = 0; i < 5; i++) {
        const de = (form.elements[`${f.k}_de_${i}`]?.value || '').trim(), val = (form.elements[`${f.k}_valor_${i}`]?.value || '').trim();
        if (de === '' && val === '') continue;
        o[f.k].push({ de: num(de), tipo: form.elements[`${f.k}_tipo_${i}`].value, valor: num(val) });
      }
      o[f.k].sort((a, b) => a.de - b.de);
    }
    else if (f.t === 'file') o[f.k] = form.elements[f.k]?.files?.[0] || null;
    else if (f.t === 'checks') o[f.k] = $$(`[name="${f.k}"]:checked`, form).map(e => e.value);
    else { const v = (form.elements[f.k]?.value ?? '').trim(); o[f.k] = f.t === 'money' ? (v === '' ? '' : num(v)) : v; }
  }
  return o;
}
function openForm({ title, fields, values = {}, onSave, intro = '', saveLabel = 'Salvar', onRender }) {
  const dlg = $('#dlg');

  const form = $('form', dlg);

  $('input:not([type=checkbox]),select,textarea', form)?.focus();
}

/* horário fixo: sessões recorrentes sem data de término. O app mantém sempre as próximas
   HORIZON_DAYS agendadas; o id de cada sessão gerada é fixo (série + data), então dois aparelhos
   nunca duplicam a mesma sessão, e uma sessão excluída não volta (a série guarda até onde já gerou). */
const HORIZON_DAYS = 56;
const SERIE_TXT = { 1: 'Toda semana', 2: 'A cada 2 semanas', 4: 'A cada 4 semanas' };
const serieResumo = sr => `${SERIE_TXT[sr.intervalo] || 'Toda semana'}, ${WD_FULL[parseISO(sr.inicio).getDay()]}${sr.hora ? ' às ' + sr.hora.replace(':', 'h') : ''}`;
function topUpSeries() {
  if (!db) return 0;
  const t = today(), until = addDays(t, HORIZON_DAYS), ids = new Set(db.sessions.map(s => s.id));
  let n = 0;
  for (const p of db.patients) {
    if (p.status !== 'ativo') continue;
    for (const sr of p.series || []) {
      if (!sr.ativa) continue;
      const step = 7 * (sr.intervalo || 1);
      // próxima data alinhada ao dia da semana de início; depois de uma pausa, não cria sessões no passado
      const min = sr.gerado ? (addDays(sr.gerado, 1) > t ? addDays(sr.gerado, 1) : t) : sr.inicio;
      const gap = Math.round((parseISO(min) - parseISO(sr.inicio)) / 864e5);
      let d = addDays(sr.inicio, Math.max(0, Math.ceil(gap / step)) * step);
      while (d <= until && (!sr.fim || d < sr.fim)) {
        const id = `${sr.id}-${d}`;
        if (!ids.has(id)) {
          db.sessions.push(stampRepasse({ id, pacienteId: p.id, serieId: sr.id, data: d, hora: sr.hora, duracao: sr.duracao, valor: sr.valor, modalidade: sr.modalidade, status: 'agendado' }, p));
          ids.add(id); n++;

}

  const rm = new Set(futureOfSerie(sr.id, from).map(s => s.id));
  db.sessions = db.sessions.filter(s => !rm.has(s.id));
  sr.ativa = false; sr.fim = from;

}

  p.series.push(sr); topUpSeries();
  return sr;
}

function newSession(pid, preset = {}) {

    values: { data: today(), duracao: db.settings.duracaoPadrao, valor: p.valor, status: 'agendado', modalidade: p.modalidade === 'Online' ? 'Online' : (p.modalidade ? 'Presencial' : ''), ...preset },

      const sr = newSerie(p, { ...v, repeticao: rep });

function repasseLive(p, s) {  // mostra, sem campo para preencher, o repasse calculado; acompanha o valor digitado
  return form => {

}

function suggestReference(pid) {
  const bal = balance(pid);
  if (bal.bal <= 0) return { valor: '', referencia: '' };
  // sessões cobráveis mais recentes que somam o saldo em aberto
  const ss = sessOf(pid).filter(billable).sort(bySess).reverse(); let acc = 0; const pick = [];
  for (const s of ss) { if (acc >= bal.bal - 0.005) break; acc += num(s.valor); pick.unshift(s); }
  return { valor: Math.round(bal.bal * 100) / 100, referencia: pick.length ? 'Sessões de ' + pick.map(s => fmtD(s.data).slice(0, 5)).join(', ') : '' };
}
function newPayment(pid) {
  const p = P(pid), pay = payer(p), sug = suggestReference(pid);
  openForm({ title: `Pagamento — ${p.nome}`, fields: paymentFields(),

    onSave: async v => { if (!v.valor) { notice('Informe o valor.'); return false; } db.payments.push({ id: uid(), pacienteId: pid, ...v }); await commit('Pagamento registrado.'); } });

  if (s.reagendadoDe) { const o = S(s.reagendadoDe); bits.push(`reagendada${o ? ' de ' + fmtD(o.data) : ''}`); }
  if (s.serieId) bits.push('↻ horário fixo');
  if (s.status === 'agendado' && sessLink(s)) bits.push(`<a href="${esc(sessLink(s))}" target="_blank" rel="noopener">entrar na chamada</a>`);
  if (s.motivo) bits.push(esc(s.motivo));
  if ((s.status === 'falta' || s.status === 'cancelado')) bits.push(s.cobrar ? 'cobrada' : 'não cobrada');
  { const pl = PLAT(platOf(s)), r = s.status === 'agendado' ? (hasVal(s.repasse) ? num(s.repasse) : repasseRate(P(s.pacienteId), s.valor)) : repasseOf(s);
    if (pl && r > 0) bits.push(`repasse ${money(r)} (${esc(pl.nome)})`); }
  return bits.length ? `<div class="muted">${bits.join(' · ')}</div>` : '';
}

      <div class="stat"><b>${money(recMes)}</b><span>recebido em ${MONTHS[Number(month.slice(5)) - 1]}</span></div>
      <div class="stat ${owing.length ? 'warn' : ''}"><b>${money(sum(owing, x => x.bal))}</b><span>a receber</span></div>

  const theme = document.documentElement.dataset.theme || '';
  return `<div class="head"><h1>Configurações</h1></div>
    <form class="card" data-submit="save-settings"><div class="grid">${SETTINGS_FIELDS.map(f => fieldHTML(f, db.settings[f.k])).join('')}</div>
      <div class="row" style="justify-content:flex-end;margin-top:14px"><button class="btn primary">Salvar configurações</button></div></form>
    <div class="cols">
      <div class="card"><h2>Backup</h2>
        <p class="muted">Os dados ficam apenas neste navegador, neste computador. Faça backups com frequência (ex.: toda semana) e guarde em um pendrive ou nuvem.</p>
        <div class="row"><button class="btn primary" data-act="export-vault">Baixar backup criptografado</button><button class="btn" data-act="import">Restaurar backup</button></div>
        <p class="muted">O backup criptografado só abre com a senha atual. Para levar a outro computador, abra este arquivo lá e escolha “Restaurar backup”.</p>
        <button class="btn sm" data-act="export-json">Exportar dados abertos (sem criptografia)</button>
        <p class="muted" style="margin-bottom:0">Tamanho dos dados (criptografados): ${sizeTxt}${allDocs.length ? ` · anexos: ${allDocs.length} arquivo(s), ${fmtSize(docsSize)}` : ''}.</p></div>
      <div class="card"><h2>Segurança e aparência</h2>
        <p class="muted">Bloqueio automático após ${AUTOLOCK_MIN} minutos sem uso.</p>
        <p class="muted">${cloud ? 'Sincronização ligada: os dados criptografados ficam na sua conta do claude.ai, visíveis só para você, e abrem em qualquer aparelho com a sua senha.' : 'Os dados ficam só neste aparelho. Pela página publicada no claude.ai, eles também sincronizam entre aparelhos.'}</p>
        <div class="row"><button class="btn" data-act="change-pw">Trocar senha</button><button class="btn" data-act="lock">Bloquear agora</button></div>
        <h3 style="margin-top:16px">Plano de fundo</h3><p class="muted" style="margin:0">Cada aparelho tem a sua escolha (fica salva na conta).</p>
        <div class="bgs">${BG_OPTS.map(([v, l]) => `<button class="sw ${currentBg() === v ? 'on' : ''}" data-act="set-bg" data-v="${v}" style="background:${v ? `var(--bg-${v})` : 'var(--bg)'}" aria-label="${l}"><span>${l}</span></button>`).join('')}
          <button class="sw ${currentBg() === 'foto' ? 'on' : ''}" data-act="${ap().foto ? 'set-bg' : 'bg-photo'}" data-v="foto" style="background:${ap().foto ? 'var(--bg-foto)' : 'var(--surface-2)'}" aria-label="Minha foto"><span>${ap().foto ? 'Minha foto' : '+ Minha foto'}</span></button></div>
        ${ap().foto ? '<div class="row"><button class="btn sm" data-act="bg-photo">Trocar foto</button><button class="btn sm" data-act="bg-photo-remove">Remover foto</button></div>' : ''}
        <h3 style="margin-top:16px">Tema</h3><div class="row">${[['', 'Automático'], ['light', 'Claro'], ['dark', 'Escuro']].map(([v, l]) => `<button class="btn sm ${theme === v ? 'primary' : ''}" data-act="theme" data-v="${v}">${l}</button>`).join('')}</div>
        <h3 style="margin-top:16px">Zona de perigo</h3><button class="btn danger" data-act="wipe">Apagar todos os dados deste navegador</button></div>
    </div>`;
}

/* ---------- roteador ---------- */
let curRoute = 'inicio';
function go(path) {
  const top = x => x.split('/').slice(0, 2).join('/');
  if (top(path) !== top(curRoute)) window.scrollTo(0, 0);
  curRoute = path; render();
}
function route() { const [page, id, tab] = (curRoute || 'inicio').split('/'); return { page, id, tab }; }
function render() {
  if (!db) return;
  const r = route();
  listRenderer = null;
  const views = { inicio: vDashboard, pacientes: vPatients, p: vPatient, agenda: vAgenda, financeiro: vFinance, contatos: vContacts, config: vConfig };
  const active = document.activeElement, focusKey = active?.dataset?.ui, selStart = active?.selectionStart;
  $('#main').innerHTML = (views[r.page] || vDashboard)(r);
  $$('#nav a').forEach(a => a.classList.toggle('on', a.dataset.page === (r.page === 'p' ? 'pacientes' : r.page)));
  if (focusKey) { const el = $(`[data-ui="${focusKey}"]`); if (el) { el.focus(); try { el.setSelectionRange(selStart, selStart); } catch {} } }
}

showLock();
</script>
</body>
</html>
